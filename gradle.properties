# Project-wide Gradle settings.
# Specifies the JVM arguments used for the daemon process with parallel GC for low pause times.
org.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

android.useAndroidX=true
android.injected.testOnly=false

org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
kotlin.incremental=true
android.nonTransitiveRClass=true
org.gradle.configuration-cache=true
org.gradle.tooling.parallel=true

# Enables R8 full mode for maximum minification and bytecode optimization during Release builds
android.enableR8.fullMode=true
