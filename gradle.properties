# Project-wide Gradle settings.
# Specifies JVM arguments with G1GC for low-latency Gradle Daemon performance
org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1536m -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

android.useAndroidX=true
android.injected.testOnly=false

org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
kotlin.incremental=true
android.nonTransitiveRClass=true
org.gradle.configuration-cache=true
org.gradle.tooling.parallel=true

# Enables R8 full mode for maximum minification and bytecode optimization during Release builds
android.enableR8.fullMode=true

# Android Studio 2024+ & Kotlin 2.x KSP2 & RClass build optimizations
ksp.useKSP2=true
android.enableAppCompileTimeRClass=true
kotlin.daemon.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1536m -XX:+UseG1GC
