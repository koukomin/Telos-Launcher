# Automated AndroidX Room Database Schema & Migration Verification

name: Room Database Schema Verification

on:
  push:
    branches: [main]
    paths:
      - 'data/database/**'
      - 'data/contacts/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Room Database Compilation & Schemas
        run: |
          echo "Verifying Room database compilation across data/database..."
          ./gradlew :data:database:compileDebugKotlin
          echo "Room schema verification completed successfully!"

  startup-instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Build production database startup test
        run: ./gradlew :data:database:assembleDebugAndroidTest --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew :data:database:connectedDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: database-startup-api-${{ matrix.api }}
          path: |
            data/database/build/reports/androidTests/
            data/database/build/outputs/androidTest-results/
          if-no-files-found: warn
