# Automated AndroidX Room Database Schema & Migration Verification

name: Room Database Schema Verification

on:
  push:
    branches: [main]
    paths:
      - 'data/database/**'
      - 'data/contacts/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Verify Room Database Compilation & Schemas
        run: |
          echo "Verifying Room database compilation across data/database..."
          ./gradlew :data:database:compileDebugKotlin
          echo "Room schema verification completed successfully!"
