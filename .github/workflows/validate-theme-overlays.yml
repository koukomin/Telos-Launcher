name: Validate theme overlays
on:
  pull_request:
    paths:
      - 'app/ui/src/main/java/de/mm20/launcher2/ui/component/FrostedGlass.kt'
      - 'app/ui/src/main/java/de/mm20/launcher2/ui/component/VirtualAppBlur.kt'
      - 'app/ui/src/main/java/de/mm20/launcher2/ui/component/TelosSearchBar.kt'
      - 'app/ui/src/main/java/de/mm20/launcher2/ui/media/**'
      - 'app/ui/src/main/java/de/mm20/launcher2/ui/comms/**'
      - 'app/ui/src/main/java/de/mm20/launcher2/ui/settings/comms/**'
      - 'services/comms/**'
      - 'core/ktx/**'
      - 'core/preferences/**'
      - 'app/ui/src/test/java/de/mm20/launcher2/ui/component/FrostedTintTest.kt'
      - '.github/workflows/validate-theme-overlays.yml'
# Keep only the newest checks for this PR; published releases use their own workflow.
concurrency:
  group: theme-overlays-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  compile-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - run: chmod +x gradlew
      - name: Compile and test UI
        run: ./gradlew :core:ktx:testDebugUnitTest :core:preferences:testDebugUnitTest :services:comms:testDebugUnitTest :app:ui:testDefaultDebugUnitTest :app:app:assembleDefaultDebug --no-daemon --max-workers=1 -Dorg.gradle.parallel=false -Pkotlin.compiler.execution.strategy=in-process -Dorg.gradle.jvmargs=-Xmx3072m --stacktrace
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: theme-overlay-validation
          path: |
            app/ui/build/reports/tests/
            services/comms/build/reports/tests/
            core/ktx/build/reports/tests/
            core/preferences/build/reports/tests/
            app/app/build/outputs/apk/default/debug/*.apk
