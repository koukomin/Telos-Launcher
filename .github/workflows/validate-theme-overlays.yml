name: Validate theme overlays
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - 'app/ui/src/main/java/de/mm20/launcher2/ui/component/FrostedGlass.kt'
      - 'app/ui/src/main/java/de/mm20/launcher2/ui/component/VirtualAppBlur.kt'
      - 'app/ui/src/main/java/de/mm20/launcher2/ui/component/TelosSearchBar.kt'
      - 'app/ui/src/main/java/de/mm20/launcher2/ui/media/**'
      - 'app/ui/src/main/java/de/mm20/launcher2/ui/comms/**'
      - 'app/ui/src/main/java/de/mm20/launcher2/ui/settings/comms/**'
      - 'services/comms/**'
      - 'core/ktx/**'
      - 'core/preferences/**'
      - 'app/ui/src/test/java/de/mm20/launcher2/ui/component/FrostedTintTest.kt'
      - '.github/workflows/validate-theme-overlays.yml'
# Keep only the newest checks for this PR; published releases use their own workflow.
concurrency:
  group: theme-overlays-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  compile-and-test:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6f12 # v4.2.2
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@94baf225fe0a508e581a564467443d0e2379123b # v4
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - run: chmod +x gradlew
      - name: Compile and test UI
        run: ./gradlew :core:ktx:testDebugUnitTest :core:preferences:testDebugUnitTest :services:comms:testDebugUnitTest :app:ui:testDefaultDebugUnitTest :app:app:assembleDefaultDebug --no-daemon --max-workers=1 -Dorg.gradle.parallel=false -Pkotlin.compiler.execution.strategy=in-process '-Dorg.gradle.jvmargs=-Xmx7g -Dfile.encoding=UTF-8' --stacktrace --no-configuration-cache
      - uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4
        if: always()
        with:
          name: theme-overlay-validation
          path: |
            app/ui/build/reports/tests/
            services/comms/build/reports/tests/
            core/ktx/build/reports/tests/
            core/preferences/build/reports/tests/
            app/app/build/outputs/apk/default/debug/*.apk
