name: Shizuku pairing regression
on:
  pull_request:
    paths:
      - 'services/app-management/**'
      - 'libs/shizuku-next/**'
      - 'app/ui/src/main/java/de/mm20/launcher2/ui/system/SystemShizukuScreen.kt'
      - '.github/workflows/shizuku-pairing-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pairing-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Compile UI, run unit regressions, build physical-device harness
        run: ./gradlew :services:app-management:testDebugUnitTest :services:app-management:assembleDebugAndroidTest :app:ui:compileDefaultDebugKotlin --console=plain --max-workers=4
      - name: Verify both ARM pairing libraries are packaged
        shell: python
        run: |
          from pathlib import Path
          import zipfile
          apk = next(Path('services/app-management/build/outputs/apk/androidTest/debug').glob('*.apk'))
          with zipfile.ZipFile(apk) as archive:
              names = set(archive.namelist())
              for abi in ('arm64-v8a', 'armeabi-v7a'):
                  for library in ('libadb.so', 'libshizuku.so', 'librish.so'):
                      assert f'lib/{abi}/{library}' in names, (abi, library)
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: shizuku-pairing-validation
          path: |
            services/app-management/build/test-results/
            services/app-management/build/outputs/apk/androidTest/debug/*.apk
