name: Shizuku pairing regression
on:
  pull_request:
    paths:
      - 'services/app-management/**'
      - 'libs/shizuku-next/**'
      - 'app/ui/src/main/java/de/mm20/launcher2/ui/system/SystemShizukuScreen.kt'
      - '.github/workflows/shizuku-pairing-check.yml'
      - 'tools/release-shizuku-native-check.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pairing-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Compile UI, run unit regressions, build physical-device harness
        run: ./gradlew :services:app-management:testDebugUnitTest :services:app-management:assembleDebugAndroidTest :app:ui:compileDefaultDebugKotlin --console=plain --max-workers=1 -Dorg.gradle.parallel=false -Pkotlin.compiler.execution.strategy=in-process '-Dorg.gradle.jvmargs=-Xmx7g -Dfile.encoding=UTF-8' --no-configuration-cache
      - name: Verify ARM payloads and ARM64 16 KB ELF alignment
        run: python3 tools/release-shizuku-native-check.py --require-both services/app-management/build/outputs/apk/androidTest/debug/*.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: shizuku-pairing-validation
          path: |
            services/app-management/build/test-results/
            services/app-management/build/outputs/apk/androidTest/debug/*.apk
