name: Validate native Telos apps
on:
  pull_request:
    paths:
      - 'app/ui/src/main/java/de/mm20/launcher2/ui/camera/**'
      - 'app/ui/src/main/java/de/mm20/launcher2/ui/ermis/**'
      - 'app/ui/src/main/java/de/mm20/launcher2/ui/network/nextdns/**'
      - 'services/network/src/main/java/de/mm20/launcher2/network/nextdns/**'
      - 'app/ui/src/main/java/de/mm20/launcher2/ui/media/akou/**'
      - 'services/comms/src/main/java/de/mm20/launcher2/comms/ermis/**'
      - 'services/comms/src/main/java/de/mm20/launcher2/comms/akou/**'
      - 'app/ui/src/main/java/de/mm20/launcher2/ui/files/**'
      - '.github/workflows/validate-native-apps.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-compile-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Compile native app screens and run communication tests
        run: ./gradlew :services:comms:testDebugUnitTest :services:network:testDebugUnitTest :app:ui:compileDefaultDebugKotlin --continue --stacktrace
      - name: Test camera bounds, telemetry, magnifier and Files exclusions
        run: ./gradlew :app:ui:testDefaultDebugUnitTest --tests '*CameraImageSizingTest' --tests '*CpuTelemetryTest' --tests '*MagnifierFilterTest' --tests '*StorageExclusionsTest' --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-app-test-results
          path: services/comms/build/reports/tests/
          if-no-files-found: warn
