name: Validate native Telos apps
on:
  pull_request:
    paths:
      - 'app/ui/src/main/java/de/mm20/launcher2/ui/system/**'
      - 'app/ui/src/main/java/de/mm20/launcher2/ui/tools/**'
      - 'app/ui/src/main/java/de/mm20/launcher2/ui/notes/**'
      - 'app/ui/src/main/java/de/mm20/launcher2/ui/common/share/**'
      - 'app/ui/src/test/java/de/mm20/launcher2/ui/tools/**'
      - 'app/ui/build.gradle.kts'
      - 'app/ui/src/main/java/de/mm20/launcher2/ui/camera/**'
      - 'app/ui/src/main/java/de/mm20/launcher2/ui/ermis/**'
      - 'app/ui/src/main/java/de/mm20/launcher2/ui/network/nextdns/**'
      - 'services/network/src/main/java/de/mm20/launcher2/network/nextdns/**'
      - 'app/ui/src/main/java/de/mm20/launcher2/ui/media/akou/**'
      - 'services/comms/src/main/java/de/mm20/launcher2/comms/ermis/**'
      - 'services/comms/src/main/java/de/mm20/launcher2/comms/akou/**'
      - 'app/ui/src/main/java/de/mm20/launcher2/ui/files/**'
      - 'app/ui/src/main/java/de/mm20/launcher2/ui/component/preferences/**'
      - 'app/ui/src/main/java/de/mm20/launcher2/ui/settings/main/**'
      - 'app/ui/src/main/java/de/mm20/launcher2/ui/theme/typography/**'
      - 'app/ui/src/androidTest/**'
      - '.github/workflows/validate-native-apps.yml'
  workflow_dispatch:
# Keep only the newest checks for this PR; published releases use their own workflow.
concurrency:
  group: native-apps-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  native-compile-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify virtual-app Recents metadata
        run: |
          python tools/validation/virtual_app_manifest.py
          python tools/validation/system_app_routes.py
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Compile native app screens and run communication tests
        run: ./gradlew :services:comms:testDebugUnitTest :services:network:testDebugUnitTest :app:ui:compileDefaultDebugKotlin --continue --stacktrace
      - name: Test camera bounds, telemetry, magnifier and Files exclusions
        run: ./gradlew :app:ui:testDefaultDebugUnitTest --tests '*CameraImageSizingTest' --tests '*CameraCodeDecoderTest' --tests '*CpuTelemetryTest' --tests '*MagnifierFilterTest' --tests '*StorageExclusionsTest' --tests '*SavedWifiParserTest' --tests '*MorseCodecTest' --tests '*CallTouchPolicyTest' --tests '*MediaLayoutPolicyTest' --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-app-test-results
          path: services/comms/build/reports/tests/
          if-no-files-found: warn

  adaptive-ui-instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Verify virtual-app Recents metadata
        run: |
          python tools/validation/virtual_app_manifest.py
          python tools/validation/system_app_routes.py
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Build shared UI instrumented tests
        run: ./gradlew :app:ui:assembleDefaultDebugAndroidTest --no-daemon --max-workers=1 -Dorg.gradle.parallel=false -Pkotlin.compiler.execution.strategy=in-process -Dorg.gradle.jvmargs=-Xmx3072m --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell wm size 1440x1200
            adb shell wm density 160
            bash tools/validation/run-ui-device-tests.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adaptive-ui-instrumented-results
          path: |
            app/ui/build/reports/androidTests/
            app/ui/build/outputs/androidTest-results/
            app/ui/build/ui-screenshots/
