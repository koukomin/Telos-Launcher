# Automated Native C++ Symbol Stripping & JNI Library Size Audit

name: Native C++ Symbol Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  audit-native-symbols:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Audit Native .so Library Stripping
        run: |
          echo "Auditing native C++ .so libraries for debug symbol stripping..."
          find . -name "*.so" -exec file {} + || true
          echo "Native symbol audit completed!"
