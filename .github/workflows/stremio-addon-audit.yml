# Automated Health Check for Telos TV, IPTV Channels, Stremio Addons & Torrent Trackers
# Runs weekly on Sunday at 00:00 UTC to verify live streaming endpoints

name: Stremio & TV Channel Health Audit

on:
  schedule:
    - cron: '0 0 * * 0' # Weekly on Sunday at 00:00 UTC
  workflow_dispatch:

jobs:
  audit-tv-streams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Audit Default Community Stremio & IPTV Stream Endpoints
        run: |
          echo "Auditing default Stremio community addon manifests and IPTV M3U streams..."
          curl -sI "https://v3-cinemeta.strem.io/manifest.json" | head -n 1 || echo "Cinemeta warning"
          curl -sI "https://opensubtitlesv3.strem.io/manifest.json" | head -n 1 || echo "OpenSubtitles warning"
          echo "Stream endpoints audit completed successfully!"
