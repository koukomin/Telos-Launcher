# Automated Telos Linux Desktop AppImage & UberJar Package Builder
# Builds native Linux packages on tag push (v*) or dispatch

name: Build Linux Desktop Artifacts

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - 'desktop-linux/**'
      - '.github/workflows/build-linux-desktop.yml'
  pull_request:
    paths:
      - 'desktop-linux/**'
      - '.github/workflows/build-linux-desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  session-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Session scripts and unit tests
        run: |
          chmod +x gradlew desktop-linux/session/telos-session desktop-linux/session/labwc/autostart
          sh -n desktop-linux/session/telos-session
          sh -n desktop-linux/session/labwc/autostart
          test -f desktop-linux/session/labwc/rc.xml
          test -f desktop-linux/session/niri/config.kdl
          test -f desktop-linux/session/telos.desktop
          ./gradlew :ui-kmp:jvmTest :desktop-linux:test --stacktrace

  build-linux-desktop:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Linux Desktop UberJar Package
        run: ./gradlew :desktop-linux:packageUberJarForCurrentOS --stacktrace

      - name: Upload Linux Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: telos-linux-desktop-jar-${{ matrix.os }}
          path: desktop-linux/build/compose/jars/*.jar
