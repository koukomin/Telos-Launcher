# Automated Shizuku & Privileged Root IPC Integration Test

name: Shizuku & Root Integration Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-shizuku-ipc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Verify Shizuku & Freeze IPC Compilation
        run: |
          echo "Verifying Shizuku and Root IPC compilation across services/freeze and services/app-management..."
          ./gradlew :services:freeze:compileDebugKotlin :services:app-management:compileDebugKotlin
          echo "Shizuku & Root IPC compilation check passed!"
