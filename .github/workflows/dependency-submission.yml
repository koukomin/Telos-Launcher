name: Automatic Dependency Submission (Gradle)

on:
  push:
    branches: [main]
    paths:
      - '**/*.gradle.kts'
      - '**/gradle.properties'
      - '**/libs.versions.toml'
      - '**/gradle-wrapper.properties'
      - '.github/workflows/dependency-submission.yml'
  workflow_dispatch:

concurrency:
  group: dependency-submission-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  dependency-submission:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/dependency-submission@v4
        with:
          gradle-build-configuration: 'defaultDebugRuntimeClasspath'
