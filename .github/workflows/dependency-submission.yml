name: Automatic Dependency Submission (Gradle)

on:
  push:
    branches: [main]
    paths:
      - '**/*.gradle.kts'
      - '**/gradle.properties'
      - '**/libs.versions.toml'
      - '**/gradle-wrapper.properties'
      - '.github/workflows/dependency-submission.yml'
  workflow_dispatch:

concurrency:
  group: dependency-submission-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  dependency-submission:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6f12 # v4.2.2
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/dependency-submission@v4
        with:
          gradle-build-configuration: 'defaultDebugRuntimeClasspath'
