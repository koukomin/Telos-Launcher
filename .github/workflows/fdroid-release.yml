name: Release Telos (F-Droid Compliant)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build F-Droid Release APK
        run: ./gradlew :app:app:assembleRelease -PfdroidBuild=true

      - name: Collect Release APKs
        run: |
          mkdir -p release_apks
          find app/app/build/outputs/apk -name "*.apk" -exec cp {} release_apks/ \;
          ls -la release_apks/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release_apks/*.apk
          title: "Telos Launcher ${{ github.ref_name }}"
          body: |
            Telos Launcher Release ${{ github.ref_name }}
            
            - **F-Droid Compliant Build**
            - **Auto-Optimized ARM64 Engine**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
