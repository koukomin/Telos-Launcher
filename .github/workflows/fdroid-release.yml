name: Release Telos (F-Droid Compliant)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build F-Droid Release APK
        run: ./gradlew :app:app:assembleFdroidRelease

      - name: Collect Release APKs
        run: |
          mkdir -p release_apks
          find app/app/build/outputs/apk -name "*.apk" -exec cp {} release_apks/ \;
          ls -la release_apks/

      - name: Upload F-Droid APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: telos-fdroid
          path: release_apks/*.apk
          if-no-files-found: error
