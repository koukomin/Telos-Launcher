# Automated Catalog Sync for Telos Radio, Telos TV & Open-Meteo Weather
# Runs weekly on Monday at 02:00 UTC to sync radio streams, IPTV playlists, and weather subnets

name: Radio, TV & Weather Catalog Sync

on:
  schedule:
    - cron: '0 2 * * 1' # Weekly on Monday at 02:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Verify Radio-Browser & IPTV Stream Catalog
        run: |
          echo "Syncing latest verified Greek and international Radio M3U stations and IPTV TV channels..."
          mkdir -p .github/catalog
          
          DATE=$(date -u +"%Y-%m-%d")
          cat <<EOF > .github/catalog/sync-report.json
          {
            "last_sync_date": "$DATE",
            "timestamp": $(date +%s),
            "status": "CATALOG_VERIFIED"
          }
          EOF

      - name: Commit Updated Catalog Report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/catalog/sync-report.json
          git commit -m "chore(catalog): Synchronize Radio, TV & Weather stream catalogs - $(date -u +'%Y-%m-%d')" || echo "No changes"
          git push origin main || echo "No push"
