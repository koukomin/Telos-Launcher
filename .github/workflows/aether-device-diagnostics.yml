name: Preflight exact Windows VM staging
'on':
  push:
    branches:
    - codex/aether-diagnostics
permissions:
  contents: read
jobs:
  windows-vm:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v7
      with:
        ref: a48e12f0abc7387b0e780e5b72b8a3f6e34a6d32
        persist-credentials: false
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Publish Windows VM launcher
      shell: pwsh
      run: '$version = (Get-Content version.properties | Where-Object { $_.StartsWith(''versionName='') }).Split(''='')[1]

        dotnet publish tools/windows-qemu-android/src/TelosAndroidVm/TelosAndroidVm.csproj -c Release -r win-x64 --self-contained
        -p:PublishSingleFile=true "-p:Version=$version" --output "$env:RUNNER_TEMP/vm-publish"

        if ($LASTEXITCODE -ne 0) { throw ''Windows VM launcher compilation failed'' }

        '
    - name: Create an explicitly synthetic APK staging fixture (never published)
      shell: pwsh
      run: 'New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/vm-apk" | Out-Null

        Set-Content -LiteralPath "$env:RUNNER_TEMP/vm-apk/telos-x86_64.apk" -Value ''STAGING TEST FIXTURE - NOT AN ANDROID
        APK'''
    - name: Assemble a clean Windows VM bundle
      shell: pwsh
      run: "$ErrorActionPreference = 'Stop'\n$stage = Join-Path $env:RUNNER_TEMP 'vm-stage'\n$output = Join-Path $env:RUNNER_TEMP\
        \ 'vm-out'\nNew-Item -ItemType Directory -Force -Path $stage, $output, (Join-Path $stage 'scripts') | Out-Null\nCopy-Item\
        \ -Recurse -Force \"$env:RUNNER_TEMP/vm-publish/*\" $stage\nforeach ($file in @('fetch-toolchain.ps1', 'prepare-qcow2.ps1',\
        \ 'blissos.lock.json', 'README.md')) {\n  Copy-Item (Join-Path 'tools/windows-qemu-android' $file) $stage\n}\nCopy-Item\
        \ tools/windows-qemu-android/scripts/first-boot-lock.sh (Join-Path $stage 'scripts')\nCopy-Item LICENSE.txt, THIRD_PARTY_NOTICES.md\
        \ $stage\nCopy-Item \"$env:RUNNER_TEMP/vm-apk/telos-x86_64.apk\" $stage\n& (Join-Path $stage 'fetch-toolchain.ps1')\
        \ -SkipIso\nforeach ($tool in @('vendor/qemu/qemu-system-x86_64.exe', 'vendor/qemu/qemu-img.exe', 'vendor/scrcpy/adb.exe',\
        \ 'vendor/scrcpy/scrcpy.exe')) {\n  $binary = Join-Path $stage $tool\n  if (-not (Test-Path -LiteralPath $binary -PathType\
        \ Leaf)) { throw \"Missing packaged tool: $tool\" }\n  if ($tool.EndsWith('adb.exe')) { & $binary version } else {\
        \ & $binary --version }\n  if ($LASTEXITCODE -ne 0) { throw \"Packaged tool failed its version check: $tool\" }\n\
        }\n$downloads = Join-Path $stage 'vendor/dl'\nif (Test-Path $downloads) { Remove-Item -Recurse -Force $downloads }\n\
        if (Test-Path (Join-Path $stage '.git')) { throw 'Repository metadata must not enter the VM bundle' }\n$version =\
        \ (Get-Content version.properties | Where-Object { $_.StartsWith('versionName=') }).Split('=')[1]\nCompress-Archive\
        \ -Path (Join-Path $stage '*') -DestinationPath (Join-Path $output \"telos-android-vm-windows-x64-$version.zip\")\n"
    - name: Verify staged archive contents without publishing the fixture
      shell: pwsh
      run: "$zip = Get-ChildItem \"$env:RUNNER_TEMP/vm-out/*.zip\" | Select-Object -First 1\nif (-not $zip) { throw 'No staged\
        \ archive' }\nAdd-Type -AssemblyName System.IO.Compression.FileSystem\n$archive = [System.IO.Compression.ZipFile]::OpenRead($zip.FullName)\n\
        try {\n  $paths = @($archive.Entries | ForEach-Object { $_.FullName.Replace('\\','/') })\n  foreach ($required in\
        \ @('TelosAndroidVm.exe','telos-x86_64.apk','LICENSE.txt','THIRD_PARTY_NOTICES.md','blissos.lock.json','scripts/first-boot-lock.sh','vendor/qemu/qemu-system-x86_64.exe','vendor/scrcpy/adb.exe'))\
        \ {\n    if ($required -notin $paths) { throw \"Archive missing $required\" }\n  }\n  if (@($paths | Where-Object\
        \ { $_ -match '(^|/)\\.git(/|$)|vendor/dl/' }).Count) { throw 'Archive contains forbidden staging debris' }\n  Write-Host\
        \ \"::notice title=Windows VM staging preflight::Published launcher and toolchain archived successfully; synthetic\
        \ APK fixture was not uploaded. Entries=$($paths.Count) Bytes=$($zip.Length)\"\n} finally { $archive.Dispose() }"
