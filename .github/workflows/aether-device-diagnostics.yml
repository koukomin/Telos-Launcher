name: Inspect and retry managed dependency submission
on:
  push:
    branches: ['codex/aether-diagnostics']
permissions:
  contents: read
  actions: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read the failed immutable run and retry only its failed jobs once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, io, zipfile
          repo='repos/'+os.environ['GITHUB_REPOSITORY']
          run='44415622395'
          logs=subprocess.check_output(['gh','api',repo+'/actions/runs/'+run+'/logs'])
          with zipfile.ZipFile(io.BytesIO(logs)) as archive:
              for name in archive.namelist():
                  if not name.endswith('.txt'):continue
                  lines=archive.read(name).decode(errors='replace').splitlines()
                  if not any('Gradle validation failed' in x or 'BUILD FAILED' in x for x in lines):continue
                  text='\n'.join(lines[-110:])[-15000:]
                  for offset in range(0,len(text),3300):
                      part=text[offset:offset+3300].replace('%','%25').replace('\r','%0D').replace('\n','%0A')
                      print('::notice title=Managed submission failure details::'+part)
          result=subprocess.run(['gh','api','--method','POST',repo+'/actions/runs/'+run+'/rerun-failed-jobs'],capture_output=True,text=True)
          if result.returncode:raise SystemExit(result.stderr)
          print('::notice title=Managed submission retry::Requested one retry of failed jobs for run '+run)
          PY
