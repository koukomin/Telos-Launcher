name: Verify Ironewolf source preparation

on:
  pull_request:
    paths:
      - 'ironewolf/**'
      - '.gitmodules'
      - '.github/workflows/verify-ironewolf.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 ironewolf/engine.py verify
      - run: python3 -m unittest discover -s ironewolf/tests -v
