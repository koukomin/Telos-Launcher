# Automated Android App Bundle (.aab) Builder for Telos Launcher

name: Build Android App Bundle (.aab)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Android App Bundle (.aab)
        run: ./gradlew :app:app:bundleDefaultRelease --stacktrace

      - name: Upload App Bundle Artifact
        uses: actions/upload-artifact@v7
        with:
          name: telos-launcher-app-bundle
          path: app/app/build/outputs/bundle/defaultRelease/*.aab
