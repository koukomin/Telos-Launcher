# Automated Android App Bundle (.aab) Builder for Telos Launcher

name: Build Android App Bundle (.aab)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write


concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - uses: android-actions/setup-android@v4
      - name: Install NDK
        run: |
          NDK="ndk;27.0.12077973"
          for attempt in 1 2 3; do
            yes | sdkmanager --install "$NDK" && exit 0
            echo "NDK install attempt $attempt failed, retrying"
            sleep 8
          done
          echo "::error::Failed to install $NDK after 3 attempts"
          exit 1

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Android App Bundle (.aab)
        timeout-minutes: 110
        env:
          GRADLE_OPTS: "-Xmx6144m -XX:MaxMetaspaceSize=1536m -XX:+UseG1GC"
        run: >-
          ./gradlew :app:app:bundleDefaultRelease --no-configuration-cache --no-daemon
          --max-workers=1 --stacktrace -Dorg.gradle.parallel=false
          -Pkotlin.compiler.execution.strategy=in-process
          '-Dorg.gradle.jvmargs=-Xmx7g -Dfile.encoding=UTF-8'

      - name: Upload App Bundle Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          retention-days: 7
          name: telos-launcher-app-bundle
          path: app/app/build/outputs/bundle/defaultRelease/*.aab
