# Automated Android App Bundle (.aab) Builder for Telos Launcher

name: Build Android App Bundle (.aab)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write


concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6f12 # v4.2.2
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4
        with:
          cache-provider: basic
      - uses: android-actions/setup-android@v4
      - name: Install NDK
        run: |
          NDK="ndk;27.0.12077973"
          for attempt in 1 2 3; do
            yes | sdkmanager --install "$NDK" && exit 0
            echo "NDK install attempt $attempt failed, retrying"
            sleep 8
          done
          echo "::error::Failed to install $NDK after 3 attempts"
          exit 1

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Android App Bundle (.aab)
        timeout-minutes: 110
        env:
          GRADLE_OPTS: "-Xmx6144m -XX:MaxMetaspaceSize=1536m -XX:+UseG1GC"
        run: >-
          ./gradlew :app:app:bundleDefaultRelease --no-configuration-cache --no-daemon
          --max-workers=1 --stacktrace -Dorg.gradle.parallel=false
          -Pkotlin.compiler.execution.strategy=in-process
          '-Dorg.gradle.jvmargs=-Xmx7g -Dfile.encoding=UTF-8'

      - name: Upload App Bundle Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: telos-launcher-app-bundle
          path: app/app/build/outputs/bundle/defaultRelease/*.aab
