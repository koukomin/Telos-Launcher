# Automated Library & Dependency Upgrader for Android Studio & GitHub
# Checks for stable updates to dependencies in gradle/libs.versions.toml and updates GitHub Actions

name: Auto Dependency Upgrader

on:
  schedule:
    - cron: '0 3 * * 0' # Weekly on Sunday at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upgrade-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6f12 # v4.2.2
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4
        with:
          cache-provider: basic

      - name: Check for stable dependency updates
        run: |
          set -o pipefail
          bash gradlew dependencyUpdates -Drevision=release --console=plain | tee dependency-updates.txt

      - name: Upload dependency report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-updates
          path: dependency-updates.txt
