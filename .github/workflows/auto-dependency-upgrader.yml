# Automated Library & Dependency Upgrader for Android Studio & GitHub
# Checks for stable updates to dependencies in gradle/libs.versions.toml and updates GitHub Actions

name: Auto Dependency Upgrader

on:
  schedule:
    - cron: '0 3 * * 0' # Weekly on Sunday at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upgrade-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Check for stable dependency updates
        run: |
          set -o pipefail
          bash gradlew dependencyUpdates -Drevision=release --console=plain | tee dependency-updates.txt

      - name: Upload dependency report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          retention-days: 7
          name: dependency-updates
          path: dependency-updates.txt
