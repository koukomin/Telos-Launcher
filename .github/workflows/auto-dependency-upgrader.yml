name: Dependency Candidate Report

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Collect open Dependabot upgrades
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh pr list --repo "$REPOSITORY" --state open --author 'app/dependabot' \
            --limit 100 --json number,title,url > dependency-updates.json
          jq -r 'if length == 0 then "No open Dependabot upgrade PRs." else .[] | "[#\(.number)](\(.url)) \(.title)" end' \
            dependency-updates.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload dependency report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          retention-days: 7
          name: dependency-updates
          path: dependency-updates.json
