name: Prepare final Telos translations
on:
  pull_request:
    paths:
      - tools/translations/**
      - .github/workflows/translate-telos.yml
  workflow_dispatch:
    inputs:
      generate:
        description: Generate translations only after functional changes are complete
        type: boolean
        default: false
      source_ref:
        description: Branch or commit to translate
        default: codex/system-appops-network
permissions:
  contents: read
jobs:
  translations:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        partition: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.source_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Gate explicit final-translation activation
        id: activation
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_GENERATE: ${{ inputs.generate }}
        run: python tools/translations/activate.py
      - name: Inventory all supported base locales
        run: python tools/translations/prepare.py
      - name: Install translation runtime
        if: steps.activation.outputs.generate == 'true'
        run: |
          python -c "import os; assert os.sysconf('SC_PAGE_SIZE') * os.sysconf('SC_PHYS_PAGES') >= 12 * 1024**3, 'Translation requires at least 12 GiB RAM'"
          pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install transformers==4.57.6 sentencepiece==0.2.1 accelerate==1.12.0 opencc-python-reimplemented==0.1.7
      - name: Generate bounded batches, preserving format tokens
        if: steps.activation.outputs.generate == 'true'
        env:
          TOKENIZERS_PARALLELISM: 'false'
          DNNL_PRIMITIVE_CACHE_CAPACITY: '0'
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
          TRANSLATION_PARTITION: ${{ matrix.partition }}
          TRANSLATION_PARTITIONS: '4'
        run: python tools/translations/generate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: telos-translations-${{ github.run_id }}-${{ matrix.partition }}
          path: translation-artifact/
          retention-days: 30
