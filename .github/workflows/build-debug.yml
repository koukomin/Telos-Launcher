name: Build Debug APK

on:
  push:
    branches:
      - 'claude/**'
      - 'codex/telos-dynamic-dns'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'sip-native/**'
      - '.github/workflows/build-sip-libs.yml'
  workflow_dispatch:

concurrency:
  group: build-debug-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preflight:
    uses: ./.github/workflows/validate-workflows.yml

  build:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Android toolchain
        uses: ./.github/actions/android-toolchain
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Download SIP native libraries
        env:
          GH_TOKEN: ${{ github.token }}
        timeout-minutes: 6
        run: bash .github/scripts/download-sip.sh

      - name: Build debug APK
        timeout-minutes: 90
        run: bash .github/scripts/build-with-summary.sh assembleDefaultDebug --stacktrace --max-workers=1 -Dorg.gradle.parallel=false -Pkotlin.compiler.execution.strategy=in-process '-Dorg.gradle.jvmargs=-Xmx7g -Dfile.encoding=UTF-8' --no-configuration-cache
      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          retention-days: 7
          name: telos-default-debug-apk
          path: app/app/build/outputs/apk/default/debug/*.apk
