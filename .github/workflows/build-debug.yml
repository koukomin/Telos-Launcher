name: Build Debug APK

on:
  push:
    branches:
      - 'claude/**'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'sip-native/**'
      - '.github/workflows/build-sip-libs.yml'
      - '.github/workflows/build-debug.yml'
  workflow_dispatch:

concurrency:
  group: build-debug-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Download SIP native libraries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download sip-libs --pattern sip-libs.tar.gz --dir "$RUNNER_TEMP"; then
            tar -xzf "$RUNNER_TEMP/sip-libs.tar.gz" -C sip-native
          else
            echo "No SIP libraries released yet, building without the SIP engine"
          fi
      - name: Build debug APK
        run: ./gradlew assembleDefaultDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: telos-default-debug-apk
          path: app/app/build/outputs/apk/default/debug/*.apk
