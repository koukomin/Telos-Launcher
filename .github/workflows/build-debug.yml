name: Build Debug APK

on:
  push:
    branches:
      - 'claude/**'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'sip-native/**'
      - '.github/workflows/build-sip-libs.yml'
      - '.github/workflows/build-debug.yml'
  workflow_dispatch:

concurrency:
  group: build-debug-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Download SIP native libraries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download sip-libs --pattern sip-libs.tar.gz --dir "$RUNNER_TEMP"; then
            tar -xzf "$RUNNER_TEMP/sip-libs.tar.gz" -C sip-native
          else
            echo "No SIP libraries released yet, building without the SIP engine"
          fi
      - name: Build debug APK
        run: ./gradlew assembleDefaultDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: telos-default-debug-apk
          path: app/app/build/outputs/apk/default/debug/*.apk

      # The steps below only run when the build above succeeded
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls app/app/build/outputs/apk/default/debug/*.apk | head -n 1)
          SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          TAG="dev-$GITHUB_RUN_NUMBER"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          cp "$APK" "$RUNNER_TEMP/telos-debug.apk"
          gh release create "$TAG" "$RUNNER_TEMP/telos-debug.apk" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Telos dev build #$GITHUB_RUN_NUMBER ($SHORT_SHA)" \
            --notes "Automatic debug build of branch \`$GITHUB_REF_NAME\` at commit $SHORT_SHA. Debug-signed, for testing only."
          # keep only the three newest dev builds
          gh release list --limit 100 --json tagName --jq '.[].tagName' \
            | grep '^dev-' | sort -t- -k2 -n -r | tail -n +4 \
            | while read -r OLD; do gh release delete "$OLD" --cleanup-tag --yes || true; done
      - name: Update pull request comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR=$(gh pr list --head "$GITHUB_REF_NAME" --state open --json number --jq '.[0].number')
          if [ -n "$PR" ]; then
            SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
            gh pr comment "$PR" --edit-last --create-if-none --body "Build passed for \`$SHORT_SHA\`

          Download the APK: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/telos-debug.apk
          Workflow run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
