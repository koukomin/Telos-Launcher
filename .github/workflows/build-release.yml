# Build Release APK
# ------------------------------------------------------------------
# Χτίζει δύο Release APK (ένα ανά αρχιτεκτονική CPU), τα υπογράφει με το δικό σου
# Keystore και τα ανεβάζει ως GitHub Release:
#   telos-arm64-v8a.apk   (64-bit, για όλα τα σύγχρονα κινητά)
#   telos-armeabi-v7a.apk (32-bit, μόνο για παλιά κινητά)
#
# Πότε τρέχει:
#   1. Όταν κάνεις push ένα tag που ξεκινά με "v" (π.χ. v1.40.2)
#   2. Χειροκίνητα: Actions → Build Release APK → Run workflow
#
# Secrets που χρειάζονται (Settings → Secrets and variables → Actions):
#   KEYSTORE              = το .jks αρχείο σε base64
#                           (Linux:   base64 -w0 telos.jks > telos.txt
#                            Windows: certutil -encode telos.jks telos.txt
#                                     και σβήνεις τις γραμμές BEGIN/END)
#   KEYSTORE_PASSWORD     = κωδικός του keystore
#   SIGNING_KEY_ALIAS     = alias του κλειδιού
#   SIGNING_KEY_PASSWORD  = κωδικός του κλειδιού
# ------------------------------------------------------------------

name: Build Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Δικαίωμα για δημιουργία GitHub Release
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        # ονόματα ABI του Android: το Store και το Obtainium ξεχωρίζουν το σωστό APK από αυτά
        abi: [arm64-v8a, armeabi-v7a]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Σταματά νωρίς με καθαρό μήνυμα αν λείπει κάποιο secret
      - name: Check signing secrets
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          for S in KEYSTORE KEYSTORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            if [ -z "${!S}" ]; then echo "::error::Λείπει το secret $S"; exit 1; fi
          done

      # Μετατρέπει το base64 secret πίσω σε keystore.jks, στη θέση
      # που περιμένει το signingConfig "gh-actions" του build.gradle.kts
      - name: Decode Keystore
        env:
          ENCODED_STRING: ${{ secrets.KEYSTORE }}
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "$ENCODED_STRING" | base64 -di > "$RUNNER_TEMP/keystore/keystore.jks"

      # Ίδιο βήμα με το debug workflow: κατεβάζει τις SIP βιβλιοθήκες αν υπάρχουν
      - name: Download SIP native libraries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download sip-libs --pattern sip-libs.tar.gz --dir "$RUNNER_TEMP"; then
            tar -xzf "$RUNNER_TEMP/sip-libs.tar.gz" -C sip-native
          else
            echo "No SIP libraries released yet, building without the SIP engine"
          fi

      # versionCode από την ημερομηνία ώστε κάθε release να είναι "νεότερο"
      # και το Android να δέχεται την ενημέρωση πάνω από την προηγούμενη.
      # Ίδιο για τα δύο APK: έτσι ένα κινητό μπορεί να περάσει από το ένα στο άλλο.
      - name: Set version code and name
        run: |
          echo "VERSION_CODE_OVERRIDE=$(date +%Y%m%d)$(printf '%02d' $((GITHUB_RUN_NUMBER % 100)))" >> "$GITHUB_ENV"
          # το όνομα έκδοσης είναι αυτό του tag (v1.41.0 -> 1.41.0): το Store συγκρίνει με αυτό για τις ενημερώσεις
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "VERSION_NAME_OVERRIDE=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"; fi

      # -Ptelos.abi βάζει στο APK μόνο τις native βιβλιοθήκες αυτής της αρχιτεκτονικής
      - name: Build and sign Release APK (${{ matrix.abi }})
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleDefaultRelease -Ptelos.abi=${{ matrix.abi }} --stacktrace

      # Επιβεβαιώνει ότι το APK υπογράφηκε με το δικό σου κλειδί (όχι debug)
      # και ότι περιέχει native βιβλιοθήκες μόνο της σωστής αρχιτεκτονικής
      - name: Verify signature and ABI
        run: |
          APK=$(ls app/app/build/outputs/apk/default/release/*.apk | head -n 1)
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs "$APK" | tee "$RUNNER_TEMP/certs.txt"
          if grep -q "CN=Android Debug" "$RUNNER_TEMP/certs.txt"; then
            echo "::error::Το APK είναι υπογεγραμμένο με debug κλειδί"; exit 1
          fi
          ABIS=$(unzip -Z1 "$APK" 'lib/*' | cut -d/ -f2 | sort -u | tr '\n' ' ')
          echo "Native library folders in the APK: $ABIS"
          if [ "$ABIS" != "${{ matrix.abi }} " ]; then
            echo "::error::Το APK πρέπει να έχει native βιβλιοθήκες μόνο για ${{ matrix.abi }}, βρέθηκαν: $ABIS"; exit 1
          fi
          mkdir -p "$RUNNER_TEMP/out"
          cp "$APK" "$RUNNER_TEMP/out/telos-${{ matrix.abi }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: telos-${{ matrix.abi }}
          path: ${{ runner.temp }}/out/telos-${{ matrix.abi }}.apk

  # Δημιουργεί ένα GitHub Release (μόνο όταν το τρέξιμο ξεκίνησε από tag) με τα δύο APK.
  # Ξεχωριστό job ώστε τα δύο builds να μην προσπαθούν να φτιάξουν το ίδιο release.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          path: apks
          pattern: telos-*
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l apks
          # Create the release with both APKs, or (if the tag UI already made the release) just upload them to it
          gh release create "$GITHUB_REF_NAME" apks/*.apk \
            --title "Telos $GITHUB_REF_NAME" \
            --notes-file .github/release-notes-header.md \
            --generate-notes \
          || gh release upload "$GITHUB_REF_NAME" apks/*.apk --clobber
