name: Release Telos Android

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
    paths:
      - '.github/workflows/build-release.yml'
      - 'tools/release-*'
      - 'version.properties'
      - 'app/app/src/main/baseline-prof.txt'
      - 'app/app/build.gradle.kts'
      - 'ui-kmp/**'
  push:
    branches: [main]
    paths: ['version.properties']
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: telos-release-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    if: github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.action != 'closed')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/release-apk-check-test.py
          python3 tools/release-version-test.py
          python3 tools/release-version.py >> "$GITHUB_OUTPUT"

  build:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Verify locked Tor native provenance before packaging
        run: python3 tools/validation/aether-native-check.py

      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          cache-provider: basic
          cache-read-only: false
      - uses: android-actions/setup-android@v4
      - name: Install NDK
        run: |
          NDK="ndk;27.0.12077973"
          for attempt in 1 2 3; do
            yes | sdkmanager --install "$NDK" && exit 0
            echo "NDK install attempt $attempt failed, retrying"
            sleep 8
          done
          echo "::error::Failed to install $NDK after 3 attempts"
          exit 1
      - name: Prepare repository signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          if [ -z "$KEYSTORE" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$SIGNING_KEY_ALIAS" ] || [ -z "$SIGNING_KEY_PASSWORD" ]; then
            echo "::error::All four repository signing secrets are required; refusing a different signing identity."
            exit 1
          fi
          printf '%s' "$KEYSTORE" | base64 -di > "$RUNNER_TEMP/keystore/keystore.jks"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_ALIAS=$SIGNING_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_PASSWORD=$SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "KS_PASS=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KS_ALIAS=$SIGNING_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KS_KEY_PASS=$SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Download SIP native libraries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download sip-libs --pattern sip-libs.tar.gz --dir "$RUNNER_TEMP"; then
            tar -xzf "$RUNNER_TEMP/sip-libs.tar.gz" -C sip-native
          else
            echo "No SIP libraries released yet, building without the SIP engine"
          fi

      - name: Build Release APK (${{ matrix.abi }})
        env:
          GRADLE_OPTS: "-Xmx5g -XX:MaxMetaspaceSize=1g -XX:+UseG1GC"
        run: >-
          ./gradlew :app:app:assembleDefaultRelease -Ptelos.abi=${{ matrix.abi }}
          --no-configuration-cache --no-daemon --max-workers=1 --stacktrace --console=plain
          -Dorg.gradle.parallel=false -Pkotlin.compiler.execution.strategy=in-process
          '-Dorg.gradle.jvmargs=-Xmx5g -Dfile.encoding=UTF-8'

      - name: Verify packaged native ABIs
        env:
          EXPECTED_ABI: ${{ matrix.abi }}
        run: python3 tools/release-apk-check.py

      - name: Verify Shizuku payloads and 16 KB ELF alignment
        run: python3 tools/release-shizuku-native-check.py

      - name: Align and Sign APK with v1/v2/v3/v4 & 16KB Page Alignment
        if: github.event_name != 'pull_request'
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"

          RAW_APK=$(ls app/app/build/outputs/apk/default/release/*.apk | head -n 1)
          ALIGNED_APK="$RUNNER_TEMP/telos-${{ matrix.abi }}-aligned.apk"
          FINAL_APK="$RUNNER_TEMP/out/telos-${{ matrix.abi }}.apk"

          mkdir -p "$RUNNER_TEMP/out"

          # Align native library ZIP entries to 16 KB; other entries to 4 bytes.
          "$ZIPALIGN" -P 16 -f -v 4 "$RAW_APK" "$ALIGNED_APK"

          # Sign with v1, v2, v3, and v4 (generates .idsig file alongside)
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/keystore/keystore.jks" \
            --ks-pass "pass:$KS_PASS" \
            --ks-key-alias "$KS_ALIAS" \
            --key-pass "pass:$KS_KEY_PASS" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled true \
            --out "$FINAL_APK" \
            "$ALIGNED_APK"

          "$ZIPALIGN" -c -P 16 -v 4 "$FINAL_APK"

          # Verify signature schemes
          "$APKSIGNER" verify --verbose --print-certs "$FINAL_APK"

          VERSION_NAME=$(sed -n 's/^versionName=//p' version.properties)
          VERSION_CODE=$(sed -n 's/^versionCode=//p' version.properties)
          BADGING=$("$BUILD_TOOLS/aapt" dump badging "$FINAL_APK")
          [[ "$BADGING" == *"versionName='$VERSION_NAME'"* ]]
          [[ "$BADGING" == *"versionCode='$VERSION_CODE'"* ]]

      - name: Upload APK artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: telos-${{ matrix.abi }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/out/telos-${{ matrix.abi }}.apk
            ${{ runner.temp }}/out/telos-${{ matrix.abi }}.apk.idsig

      - name: Upload R8 mapping
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mapping-${{ matrix.abi }}
          path: app/app/build/outputs/mapping/defaultRelease/mapping.txt
          retention-days: 90

  release:
    permissions:
      contents: write
    needs: [version, build]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.version.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: release-assets
          pattern: telos-*
          merge-multiple: true
      - name: Publish complete release
        run: |
          for FILE in telos-arm64-v8a.apk telos-armeabi-v7a.apk; do
            test -s "release-assets/$FILE"
          done
          # Tags must still point at the commit whose binaries were built.
          REMOTE_COMMIT=$(git ls-remote origin "refs/tags/$TAG" "refs/tags/$TAG^{}" | tail -n 1 | cut -f1)
          if [ -n "$REMOTE_COMMIT" ] || [ "$GITHUB_REF" != refs/heads/main ]; then
            test "$REMOTE_COMMIT" = "$GITHUB_SHA"
          fi
          git fetch origin refs/heads/main
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD
          bash tools/release-notes.sh "$TAG" "$RUNNER_TEMP/notes.md"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --target "$GITHUB_SHA" \
              --title "Telos $TAG" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          REMOTE_COMMIT=$(git ls-remote origin "refs/tags/$TAG" "refs/tags/$TAG^{}" | tail -n 1 | cut -f1)
          test "$REMOTE_COMMIT" = "$GITHUB_SHA"
          gh release upload "$TAG" release-assets/* --clobber
          gh release edit "$TAG" --draft=false --latest \
            --title "Telos $TAG" --notes-file "$RUNNER_TEMP/notes.md"
