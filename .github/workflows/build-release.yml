name: Release Telos Android

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths: &android-release-paths
      - version.properties
      - 'app/**'
      - 'core/**'
      - 'data/**'
      - 'services/**'
      - 'libs/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - '.github/workflows/build-release.yml'
      - '.github/actions/android-toolchain/**'
      - '.github/scripts/*.sh'
      - 'tools/release-*'
  push:
    branches: [main]
    paths: *android-release-paths
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: telos-release-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  preflight:
    uses: ./.github/workflows/validate-workflows.yml

  version:
    needs: preflight
    if: github.actor != 'dependabot[bot]' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      publish: ${{ steps.v.outputs.publish }}
      version_code: ${{ steps.v.outputs.version_code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/release-apk-check-test.py
          python3 tools/release-version-test.py
          python3 tools/release-version.py >> "$GITHUB_OUTPUT"

  build:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Apply release version from validation
        env:
          TAG: ${{ needs.version.outputs.tag }}
          VERSION_CODE: ${{ needs.version.outputs.version_code }}
        run: |
          printf 'versionName=%s\nversionCode=%s\n' "${TAG#v}" "$VERSION_CODE" > version.properties

      - name: Verify locked Tor native provenance before packaging
        run: python3 tools/validation/aether-native-check.py

      - name: Set up Android toolchain
        uses: ./.github/actions/android-toolchain
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Prepare repository signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          if [ -z "$KEYSTORE" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$SIGNING_KEY_ALIAS" ] || [ -z "$SIGNING_KEY_PASSWORD" ]; then
            echo "::error::All four repository signing secrets are required; refusing a different signing identity."
            exit 1
          fi
          printf '%s' "$KEYSTORE" | base64 -di > "$RUNNER_TEMP/keystore/keystore.jks"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_ALIAS=$SIGNING_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_PASSWORD=$SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "KS_PASS=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KS_ALIAS=$SIGNING_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KS_KEY_PASS=$SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Download SIP native libraries
        env:
          GH_TOKEN: ${{ github.token }}
        timeout-minutes: 6
        run: bash .github/scripts/download-sip.sh

      - name: Build Release APK (${{ matrix.abi }})
        env:
          GRADLE_OPTS: "-Xmx5g -XX:MaxMetaspaceSize=1g -XX:+UseG1GC"
        timeout-minutes: 90
        run: >-
          bash .github/scripts/build-with-summary.sh :app:app:assembleDefaultRelease -Ptelos.abi=${{ matrix.abi }}
          --no-configuration-cache --no-daemon --max-workers=1 --stacktrace
          -Dorg.gradle.parallel=false -Pkotlin.compiler.execution.strategy=in-process
          '-Dorg.gradle.jvmargs=-Xmx5g -Dfile.encoding=UTF-8'

      - name: Verify packaged native ABIs
        env:
          EXPECTED_ABI: ${{ matrix.abi }}
        run: python3 tools/release-apk-check.py

      - name: Verify Shizuku payloads and 16 KB ELF alignment
        run: python3 tools/release-shizuku-native-check.py

      - name: Align and Sign APK with v1/v2/v3/v4 & 16KB Page Alignment
        if: github.event_name != 'pull_request'
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"

          RAW_APK=$(ls app/app/build/outputs/apk/default/release/*.apk | head -n 1)
          ALIGNED_APK="$RUNNER_TEMP/telos-${{ matrix.abi }}-aligned.apk"
          FINAL_APK="$RUNNER_TEMP/out/telos-${{ matrix.abi }}.apk"

          mkdir -p "$RUNNER_TEMP/out"

          # Align native library ZIP entries to 16 KB; other entries to 4 bytes.
          "$ZIPALIGN" -P 16 -f -v 4 "$RAW_APK" "$ALIGNED_APK"

          # Sign with v1, v2, v3, and v4 (generates .idsig file alongside)
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/keystore/keystore.jks" \
            --ks-pass "pass:$KS_PASS" \
            --ks-key-alias "$KS_ALIAS" \
            --key-pass "pass:$KS_KEY_PASS" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled true \
            --out "$FINAL_APK" \
            "$ALIGNED_APK"

          "$ZIPALIGN" -c -P 16 -v 4 "$FINAL_APK"

          # Verify signature schemes
          "$APKSIGNER" verify --verbose --print-certs "$FINAL_APK"

          VERSION_NAME=$(sed -n 's/^versionName=//p' version.properties)
          VERSION_CODE=$(sed -n 's/^versionCode=//p' version.properties)
          BADGING=$("$BUILD_TOOLS/aapt" dump badging "$FINAL_APK")
          [[ "$BADGING" == *"versionName='$VERSION_NAME'"* ]]
          [[ "$BADGING" == *"versionCode='$VERSION_CODE'"* ]]

      - name: Upload APK artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: telos-${{ matrix.abi }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/out/telos-${{ matrix.abi }}.apk
            ${{ runner.temp }}/out/telos-${{ matrix.abi }}.apk.idsig

      - name: Upload R8 mapping
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mapping-${{ matrix.abi }}
          path: app/app/build/outputs/mapping/defaultRelease/mapping.txt
          retention-days: 90

  release:
    permissions:
      contents: write
    needs: [version, build]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ needs.version.outputs.tag }}
      VERSION_CODE: ${{ needs.version.outputs.version_code }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: release-assets
          pattern: telos-*
          merge-multiple: true
      - name: Publish complete release
        run: |
          assets=(telos-arm64-v8a.apk telos-arm64-v8a.apk.idsig telos-armeabi-v7a.apk telos-armeabi-v7a.apk.idsig)
          for file in "${assets[@]}"; do
            test -s "release-assets/$file"
          done
          (cd release-assets && sha256sum "${assets[@]}" > SHA256SUMS)
          git fetch origin refs/heads/main
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD

          remote_commit() {
            git ls-remote origin "refs/tags/$TAG" "refs/tags/$TAG^{}" | tail -n 1 | cut -f1
          }

          commit=$(remote_commit)
          if [[ -z $commit && $GITHUB_REF == refs/heads/main ]]; then
            git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
              tag -a "$TAG" "$GITHUB_SHA" -m "Telos versionCode=$VERSION_CODE"
            git push origin "refs/tags/$TAG"
            commit=$(remote_commit)
          fi
          test "$commit" = "$GITHUB_SHA"

          bash tools/release-notes.sh "$TAG" "$RUNNER_TEMP/notes.md"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --verify-tag \
              --title "Telos $TAG" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          gh release upload "$TAG" release-assets/* --clobber
          gh release edit "$TAG" --draft=false --latest \
            --title "Telos $TAG" --notes-file "$RUNNER_TEMP/notes.md"

          release=$(gh release view "$TAG" --json url,isDraft,assets)
          for file in "${assets[@]}" SHA256SUMS; do
            jq -e --arg file "$file" '.isDraft == false and any(.assets[]; .name == $file and .size > 0)' <<<"$release"
          done
          printf '### Published Telos %s\n\n%s\n' "$TAG" "$(jq -r .url <<<"$release")" >> "$GITHUB_STEP_SUMMARY"
