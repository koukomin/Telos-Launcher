# Build Release APK
# ------------------------------------------------------------------
# Builds Release APKs (preserving 100% of all languages/locales),
# optimizes via R8 full mode & ProGuard stripping, signs with v1, v2, v3, and v4 schemes,
# ensures 16KB page-alignment (zipalign -p -f -v 4), and publishes to GitHub Releases.
# ------------------------------------------------------------------

name: Build Release APK

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-release.yml'
      - 'tools/release-validation-request.json'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/release-notes-apk.md'
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('build-release-pr-{0}', github.event.pull_request.number) || 'build-release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: v
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            LAST=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
            LAST=${LAST:-v1.40.2}
            IFS=. read -r MA MI PA <<< "${LAST#v}"
            echo "tag=v$MA.$MI.$((PA + 1))" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  build:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        abi: [arm64-v8a, armeabi-v7a]
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Check signing secrets
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          for S in KEYSTORE KEYSTORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            if [ -z "${!S}" ]; then echo "::error::Missing signing secret $S"; exit 1; fi
          done

      - name: Decode Keystore
        env:
          ENCODED_STRING: ${{ secrets.KEYSTORE }}
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "$ENCODED_STRING" | base64 -di > "$RUNNER_TEMP/keystore/keystore.jks"

      - name: Download SIP native libraries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download sip-libs --pattern sip-libs.tar.gz --dir "$RUNNER_TEMP"; then
            tar -xzf "$RUNNER_TEMP/sip-libs.tar.gz" -C sip-native
          else
            echo "No SIP libraries released yet, building without the SIP engine"
          fi

      - name: Set version code and name
        run: |
          echo "VERSION_CODE_OVERRIDE=$(date +%Y%m%d)$(printf '%02d' $((GITHUB_RUN_NUMBER % 100)))" >> "$GITHUB_ENV"
          TAG="${{ needs.version.outputs.tag }}"
          if [ -n "$TAG" ]; then echo "VERSION_NAME_OVERRIDE=${TAG#v}" >> "$GITHUB_ENV"; fi

      - name: Build Release APK (${{ matrix.abi }})
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleDefaultRelease -Ptelos.abi=${{ matrix.abi }} --stacktrace

      - name: Align and Sign APK with v1/v2/v3/v4 & 16KB Page Alignment
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"

          RAW_APK=$(ls app/app/build/outputs/apk/default/release/*.apk | head -n 1)
          ALIGNED_APK="$RUNNER_TEMP/telos-${{ matrix.abi }}-aligned.apk"
          FINAL_APK="$RUNNER_TEMP/out/telos-${{ matrix.abi }}.apk"

          mkdir -p "$RUNNER_TEMP/out"

          # 16KB page-alignment (-p) on 4-byte boundaries for Android 15+ compatibility
          "$ZIPALIGN" -p -f -v 4 "$RAW_APK" "$ALIGNED_APK"

          # Sign with v1, v2, v3, and v4 (generates .idsig file alongside)
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/keystore/keystore.jks" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$SIGNING_KEY_ALIAS" \
            --key-pass "pass:$SIGNING_KEY_PASSWORD" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled true \
            --out "$FINAL_APK" \
            "$ALIGNED_APK"

          # Verify signature schemes and print certificates
          "$APKSIGNER" verify --verbose --print-certs "$FINAL_APK" | tee "$RUNNER_TEMP/verify-output.txt"
          if grep -q "CN=Android Debug" "$RUNNER_TEMP/verify-output.txt"; then
            echo "::error::APK signed with debug key"; exit 1
          fi

          # Verify ABI restrictions
          ABIS=$(unzip -Z1 "$FINAL_APK" 'lib/*' | cut -d/ -f2 | sort -u | tr '\n' ' ')
          echo "Native library folders in APK: $ABIS"
          if [ "$ABIS" != "${{ matrix.abi }} " ]; then
            echo "::error::APK contains unexpected ABIs: $ABIS"; exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: telos-${{ matrix.abi }}
          path: |
            ${{ runner.temp }}/out/telos-${{ matrix.abi }}.apk
            ${{ runner.temp }}/out/telos-${{ matrix.abi }}.apk.idsig

      - name: Upload R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: mapping-${{ matrix.abi }}
          path: app/app/build/outputs/mapping/defaultRelease/mapping.txt
          retention-days: 90

  release:
    needs: [version, build]
    if: needs.version.outputs.publish == 'true'
    env:
      TAG: ${{ needs.version.outputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          path: apks
          pattern: telos-*
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l apks
          chmod +x tools/release-notes.sh
          tools/release-notes.sh "$TAG" "$RUNNER_TEMP/notes.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" apks/*.apk apks/*.idsig --clobber
            gh release edit "$TAG" --title "Telos $TAG" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TAG" apks/*.apk apks/*.idsig \
              --target "$GITHUB_SHA" \
              --title "Telos $TAG" \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi
