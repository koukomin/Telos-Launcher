name: Release Android and Linux

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-release.yml'
      - 'tools/release-*'
      - 'version.properties'
      - 'app/app/src/main/baseline-prof.txt'
      - 'app/app/build.gradle.kts'
      - 'desktop-linux/**'
      - 'ui-kmp/**'
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: telos-release-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'publish' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/release-apk-check-test.py
          python3 tools/release-version-test.py
          python3 tools/release-version.py >> "$GITHUB_OUTPUT"

  build:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a]
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: false
      - name: Prepare repository signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          if [ -z "$KEYSTORE" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$SIGNING_KEY_ALIAS" ] || [ -z "$SIGNING_KEY_PASSWORD" ]; then
            echo "::error::All four repository signing secrets are required; refusing a different signing identity."
            exit 1
          fi
          printf '%s' "$KEYSTORE" | base64 -di > "$RUNNER_TEMP/keystore/keystore.jks"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_ALIAS=$SIGNING_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_PASSWORD=$SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "KS_PASS=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KS_ALIAS=$SIGNING_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KS_KEY_PASS=$SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Download SIP native libraries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download sip-libs --pattern sip-libs.tar.gz --dir "$RUNNER_TEMP"; then
            tar -xzf "$RUNNER_TEMP/sip-libs.tar.gz" -C sip-native
          else
            echo "No SIP libraries released yet, building without the SIP engine"
          fi

      - name: Build Release APK (${{ matrix.abi }})
        env:
          GRADLE_OPTS: "-Xmx6144m -XX:MaxMetaspaceSize=1536m -XX:+UseG1GC"
        run: ./gradlew assembleDefaultRelease -Ptelos.abi=${{ matrix.abi }} --stacktrace

      - name: Verify packaged native ABIs
        env:
          EXPECTED_ABI: ${{ matrix.abi }}
        run: python3 tools/release-apk-check.py

      - name: Verify Shizuku payloads and 16 KB ELF alignment
        run: python3 tools/release-shizuku-native-check.py

      - name: Align and Sign APK with v1/v2/v3/v4 & 16KB Page Alignment
        if: github.event_name != 'pull_request'
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"

          RAW_APK=$(ls app/app/build/outputs/apk/default/release/*.apk | head -n 1)
          ALIGNED_APK="$RUNNER_TEMP/telos-${{ matrix.abi }}-aligned.apk"
          FINAL_APK="$RUNNER_TEMP/out/telos-${{ matrix.abi }}.apk"

          mkdir -p "$RUNNER_TEMP/out"

          # Align native library ZIP entries to 16 KB; other entries to 4 bytes.
          "$ZIPALIGN" -P 16 -f -v 4 "$RAW_APK" "$ALIGNED_APK"

          # Sign with v1, v2, v3, and v4 (generates .idsig file alongside)
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/keystore/keystore.jks" \
            --ks-pass "pass:$KS_PASS" \
            --ks-key-alias "$KS_ALIAS" \
            --key-pass "pass:$KS_KEY_PASS" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled true \
            --out "$FINAL_APK" \
            "$ALIGNED_APK"

          "$ZIPALIGN" -c -P 16 -v 4 "$FINAL_APK"

          # Verify signature schemes
          "$APKSIGNER" verify --verbose --print-certs "$FINAL_APK"

          VERSION_NAME=$(sed -n 's/^versionName=//p' version.properties)
          VERSION_CODE=$(sed -n 's/^versionCode=//p' version.properties)
          BADGING=$("$BUILD_TOOLS/aapt" dump badging "$FINAL_APK")
          [[ "$BADGING" == *"versionName='$VERSION_NAME'"* ]]
          [[ "$BADGING" == *"versionCode='$VERSION_CODE'"* ]]


      - name: Upload APK artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: telos-${{ matrix.abi }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/out/telos-${{ matrix.abi }}.apk
            ${{ runner.temp }}/out/telos-${{ matrix.abi }}.apk.idsig

      - name: Upload R8 mapping
        uses: actions/upload-artifact@v7
        with:
          name: mapping-${{ matrix.abi }}
          path: app/app/build/outputs/mapping/defaultRelease/mapping.txt
          retention-days: 90

  linux:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Test and build Linux
        run: ./gradlew :ui-kmp:test :desktop-linux:test :desktop-linux:packageUberJarForCurrentOS --stacktrace
      - name: Package Linux artifacts
        run: |
          mkdir -p linux-out
          mapfile -t JARS < <(find desktop-linux/build/compose/jars -maxdepth 1 -name '*.jar')
          test "${#JARS[@]}" -eq 1
          VERSION_NAME=$(sed -n 's/^versionName=//p' version.properties)
          cp "${JARS[0]}" linux-out/telos-linux-desktop.jar
          cp "${JARS[0]}" "linux-out/telos-desktop-linux-x64-${VERSION_NAME}.jar"
          unzip -p linux-out/telos-linux-desktop.jar META-INF/MANIFEST.MF | grep -F "Implementation-Version: $VERSION_NAME"
          cp tools/start-telos-desktop.sh linux-out/
          tar -czf linux-out/telos-linux-session.tar.gz -C desktop-linux session
          tar -czf linux-out/telos-desktop-linux-session-x64.tar.gz -C desktop-linux session
      - uses: actions/upload-artifact@v7
        with:
          name: telos-linux
          path: linux-out/*
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Install WiX 3 (required for Compose packageExe / jpackage)
        shell: pwsh
        run: |
          choco install wixtoolset --version=3.14.1 -y --no-progress
          $candidates = @(
            "${env:ProgramFiles(x86)}\WiX Toolset v3.14\bin",
            "${env:ProgramFiles}\WiX Toolset v3.14\bin",
            "${env:ProgramFiles(x86)}\WiX Toolset v3.11\bin"
          )
          $wix = $candidates | Where-Object { Test-Path (Join-Path $_ 'light.exe') } | Select-Object -First 1
          if (-not $wix) { throw 'WiX light.exe not found after chocolatey install' }
          Add-Content -Path $env:GITHUB_PATH -Value $wix
          Write-Host "WiX bin on PATH: $wix"
      - name: Test and build Windows UberJar + Exe
        shell: bash
        run: |
          ./gradlew :ui-kmp:test :desktop-linux:test \
            :desktop-linux:packageUberJarForCurrentOS \
            :desktop-linux:createDistributable \
            :desktop-linux:packageExe \
            --stacktrace
      - name: Package Windows artifacts
        shell: bash
        run: |
          mkdir -p win-out
          VERSION_NAME=$(sed -n 's/^versionName=//p' version.properties)
          mapfile -t JARS < <(find desktop-linux/build/compose/jars -maxdepth 1 -name '*.jar')
          test "${#JARS[@]}" -eq 1
          cp "${JARS[0]}" "win-out/telos-desktop-windows-x64-${VERSION_NAME}.jar"

          mapfile -t SETUP_EXES < <(find desktop-linux/build/compose/binaries -type f -name '*.exe' \
            ! -path '*/app/*' 2>/dev/null | sort)
          if [ "${#SETUP_EXES[@]}" -lt 1 ]; then
            mapfile -t SETUP_EXES < <(find desktop-linux/build/compose -type f -name '*.exe' \
              ! -path '*/runtime/*' ! -path '*/app/telos-desktop/*' 2>/dev/null | sort)
          fi
          test "${#SETUP_EXES[@]}" -ge 1
          cp "${SETUP_EXES[0]}" "win-out/telos-desktop-windows-x64-${VERSION_NAME}-setup.exe"
          cp "win-out/telos-desktop-windows-x64-${VERSION_NAME}-setup.exe" \
            "win-out/telos-desktop-windows-x64-setup.exe"

          APP_DIR=$(find desktop-linux/build/compose/binaries -type d -path '*/app/telos-desktop' 2>/dev/null | head -1)
          test -n "$APP_DIR"
          PORTABLE_ZIP="$GITHUB_WORKSPACE/win-out/telos-desktop-windows-x64-${VERSION_NAME}-portable.zip"
          APP_DIR_WIN=$(cygpath -w "$APP_DIR" 2>/dev/null || echo "$APP_DIR")
          PORTABLE_ZIP_WIN=$(cygpath -w "$PORTABLE_ZIP" 2>/dev/null || echo "$PORTABLE_ZIP")
          powershell.exe -NoProfile -Command \
            "Compress-Archive -Path '$APP_DIR_WIN' -DestinationPath '$PORTABLE_ZIP_WIN' -Force"
          test -s "win-out/telos-desktop-windows-x64-${VERSION_NAME}-portable.zip"

          cat > win-out/README-WINDOWS.txt <<EOF
          Telos Desktop (Windows x64)
          Prefer telos-desktop-windows-x64-${VERSION_NAME}-setup.exe (bundled JRE).
          Portable: unzip *-portable.zip and run telos-desktop.exe in that folder.
          UberJar fallback (JDK 21+): java -jar telos-desktop-windows-x64-*.jar
          Defaults to Portable Data. macOS builds deferred. Unsigned CI builds.
          EOF
      - uses: actions/upload-artifact@v7
        with:
          name: telos-windows
          path: win-out/*
          if-no-files-found: error

  release:
    permissions:
      contents: write
    needs: [version, build, linux, windows]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.version.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          pattern: telos-*
          merge-multiple: true
      - name: Publish complete release
        run: |
          # Android ABIs + Linux + Windows desktop jar + Windows setup exe required.
          for FILE in telos-arm64-v8a.apk telos-armeabi-v7a.apk telos-linux-desktop.jar start-telos-desktop.sh telos-linux-session.tar.gz; do
            test -s "release-assets/$FILE"
          done
          test -n "$(ls release-assets/telos-desktop-windows-x64-*.jar 2>/dev/null | head -1)"
          test -n "$(ls release-assets/telos-desktop-windows-x64-*-setup.exe 2>/dev/null | head -1)"
          bash tools/release-notes.sh "$TAG" "$RUNNER_TEMP/notes.md"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --target "$GITHUB_SHA" \
              --title "Telos $TAG (Android & Desktop)" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          gh release upload "$TAG" release-assets/* --clobber
          gh release edit "$TAG" --draft=false --latest \
            --title "Telos $TAG (Android & Desktop)" --notes-file "$RUNNER_TEMP/notes.md"
