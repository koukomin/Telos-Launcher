# Build Release APK
# ------------------------------------------------------------------
# Χτίζει δύο Release APK (ένα ανά αρχιτεκτονική CPU), τα υπογράφει με το δικό σου
# Keystore και τα ανεβάζει ως GitHub Release:
#   telos-arm64-v8a.apk   (64-bit, για όλα τα σύγχρονα κινητά)
#   telos-armeabi-v7a.apk (32-bit, μόνο για παλιά κινητά)
#
# Πότε τρέχει:
#   1. Σε κάθε merge/push στο main (εκτός από αλλαγές μόνο σε docs/markdown): φτιάχνει αυτόματα
#      νέο tag (το επόμενο patch, π.χ. v1.40.2 -> v1.40.3) και νέο GitHub Release με τα δύο APK.
#      Για major/minor αλλαγή αρκεί να σπρώξεις ένα tag με το νέο νούμερο (π.χ. v1.41.0): τα επόμενα
#      αυτόματα releases συνεχίζουν από εκεί.
#   2. Όταν κάνεις push ένα tag που ξεκινά με "v" (π.χ. v1.41.0)
#   3. Χειροκίνητα: Actions → Build Release APK → Run workflow (χτίζει, ανεβάζει τα APK ως artifacts,
#      δεν δημιουργεί release)
#
# Secrets που χρειάζονται (Settings → Secrets and variables → Actions):
#   KEYSTORE              = το .jks αρχείο σε base64
#                           (Linux:   base64 -w0 telos.jks > telos.txt
#                            Windows: certutil -encode telos.jks telos.txt
#                                     και σβήνεις τις γραμμές BEGIN/END)
#   KEYSTORE_PASSWORD     = κωδικός του keystore
#   SIGNING_KEY_ALIAS     = alias του κλειδιού
#   SIGNING_KEY_PASSWORD  = κωδικός του κλειδιού
# ------------------------------------------------------------------

name: Build Release APK

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-release.yml'
      - 'tools/release-validation-request.json'
  push:
    branches: [main]
    # αλλαγές μόνο σε κείμενα δεν βγάζουν νέα έκδοση
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/release-notes-apk.md'
    tags:
      - 'v*'
  workflow_dispatch:

# Ένα release κάθε φορά: δύο γρήγορα merge δεν πρέπει να πάρουν το ίδιο νούμερο έκδοσης
concurrency:
  # Publishing remains serialized; superseded PR preflights must not hold it up.
  group: ${{ github.event_name == 'pull_request' && format('build-release-pr-{0}', github.event.pull_request.number) || 'build-release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Δικαίωμα για δημιουργία GitHub Release
permissions:
  contents: write

jobs:
  # Αποφασίζει το tag της έκδοσης: το tag που σπρώχτηκε, ή (σε push στο main) το επόμενο patch
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            LAST=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
            # χωρίς κανένα tag ακόμα: συνεχίζει από το versionName της εφαρμογής
            LAST=${LAST:-v1.40.2}
            IFS=. read -r MA MI PA <<< "${LAST#v}"
            echo "tag=v$MA.$MI.$((PA + 1))" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  build:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        # ονόματα ABI του Android: το Store και το Obtainium ξεχωρίζουν το σωστό APK από αυτά
        abi: [arm64-v8a, armeabi-v7a]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Σταματά νωρίς με καθαρό μήνυμα αν λείπει κάποιο secret
      - name: Check signing secrets
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          for S in KEYSTORE KEYSTORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            if [ -z "${!S}" ]; then echo "::error::Λείπει το secret $S"; exit 1; fi
          done

      # Μετατρέπει το base64 secret πίσω σε keystore.jks, στη θέση
      # που περιμένει το signingConfig "gh-actions" του build.gradle.kts
      - name: Decode Keystore
        env:
          ENCODED_STRING: ${{ secrets.KEYSTORE }}
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "$ENCODED_STRING" | base64 -di > "$RUNNER_TEMP/keystore/keystore.jks"

      # Ίδιο βήμα με το debug workflow: κατεβάζει τις SIP βιβλιοθήκες αν υπάρχουν
      - name: Download SIP native libraries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download sip-libs --pattern sip-libs.tar.gz --dir "$RUNNER_TEMP"; then
            tar -xzf "$RUNNER_TEMP/sip-libs.tar.gz" -C sip-native
          else
            echo "No SIP libraries released yet, building without the SIP engine"
          fi

      # versionCode από την ημερομηνία ώστε κάθε release να είναι "νεότερο"
      # και το Android να δέχεται την ενημέρωση πάνω από την προηγούμενη.
      # Ίδιο για τα δύο APK: έτσι ένα κινητό μπορεί να περάσει από το ένα στο άλλο.
      - name: Set version code and name
        run: |
          echo "VERSION_CODE_OVERRIDE=$(date +%Y%m%d)$(printf '%02d' $((GITHUB_RUN_NUMBER % 100)))" >> "$GITHUB_ENV"
          # το όνομα έκδοσης είναι αυτό του tag (v1.41.0 -> 1.41.0): το Store συγκρίνει με αυτό για τις ενημερώσεις
          TAG="${{ needs.version.outputs.tag }}"
          if [ -n "$TAG" ]; then echo "VERSION_NAME_OVERRIDE=${TAG#v}" >> "$GITHUB_ENV"; fi

      # -Ptelos.abi βάζει στο APK μόνο τις native βιβλιοθήκες αυτής της αρχιτεκτονικής
      - name: Build and sign Release APK (${{ matrix.abi }})
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleDefaultRelease -Ptelos.abi=${{ matrix.abi }} --stacktrace

      # Επιβεβαιώνει ότι το APK υπογράφηκε με το δικό σου κλειδί (όχι debug)
      # και ότι περιέχει native βιβλιοθήκες μόνο της σωστής αρχιτεκτονικής
      - name: Verify signature and ABI
        run: |
          APK=$(ls app/app/build/outputs/apk/default/release/*.apk | head -n 1)
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs "$APK" | tee "$RUNNER_TEMP/certs.txt"
          if grep -q "CN=Android Debug" "$RUNNER_TEMP/certs.txt"; then
            echo "::error::Το APK είναι υπογεγραμμένο με debug κλειδί"; exit 1
          fi
          ABIS=$(unzip -Z1 "$APK" 'lib/*' | cut -d/ -f2 | sort -u | tr '\n' ' ')
          echo "Native library folders in the APK: $ABIS"
          if [ "$ABIS" != "${{ matrix.abi }} " ]; then
            echo "::error::Το APK πρέπει να έχει native βιβλιοθήκες μόνο για ${{ matrix.abi }}, βρέθηκαν: $ABIS"; exit 1
          fi
          # The embedded Tor service requires this JNI library in every published ABI.
          unzip -Z1 "$APK" "lib/${{ matrix.abi }}/libtor.so" | grep -q '/libtor.so$' || {
            echo "::error::Missing embedded Tor library for ${{ matrix.abi }}"; exit 1;
          }
          mkdir -p "$RUNNER_TEMP/out"
          cp "$APK" "$RUNNER_TEMP/out/telos-${{ matrix.abi }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: telos-${{ matrix.abi }}
          path: ${{ runner.temp }}/out/telos-${{ matrix.abi }}.apk

      # R8 renames classes: crash stack traces of this APK can only be read back with its mapping file
      # (retrace mapping.txt stacktrace.txt). Not named telos-* so the release job does not publish it.
      - name: Upload R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: mapping-${{ matrix.abi }}
          path: app/app/build/outputs/mapping/defaultRelease/mapping.txt
          retention-days: 90

  # Δημιουργεί ένα GitHub Release (σε push στο main ή σε tag) με τα δύο APK.
  # Ξεχωριστό job ώστε τα δύο builds να μην προσπαθούν να φτιάξουν το ίδιο release.
  release:
    needs: [version, build]
    if: needs.version.outputs.publish == 'true'
    env:
      TAG: ${{ needs.version.outputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          path: apks
          pattern: telos-*
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l apks
          chmod +x tools/release-notes.sh
          tools/release-notes.sh "$TAG" "$RUNNER_TEMP/notes.md"
          # Always refresh notes: a previous gh release create (auto_release.sh) used to
          # leave the same static header on every tag, and `|| upload` skipped notes.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" apks/*.apk --clobber
            gh release edit "$TAG" --title "Telos $TAG" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TAG" apks/*.apk \
              --target "$GITHUB_SHA" \
              --title "Telos $TAG" \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi
