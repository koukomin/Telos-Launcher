name: Visual Regression (Roborazzi)

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/ui/src/main/**/*.kt'

permissions:
  contents: read
  pull-requests: write

jobs:
  visual-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Verify Roborazzi Visual Tests
        run: |
          echo "Placeholder: Add ./gradlew verifyRoborazziDebug once visual tests are written."
          echo "Check out https://github.com/takahirom/roborazzi for setup instructions."
        continue-on-error: true
