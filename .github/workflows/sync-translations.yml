# Automated Translation & String Specifiers Audit for Telos Launcher

name: Translation Audit & Format Validator

on:
  push:
    branches: [main]
    paths:
      - 'core/i18n/**'
      - 'data/i18n/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  audit-strings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate XML Strings Syntax & Format Specifiers
        run: |
          python3 - <<'PYXML'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          files = [file for root in ['core/i18n', 'data/i18n']
                   for file in Path(root).rglob('strings.xml')]
          if not files:
              raise SystemExit("No XML resources found")
          for file in files:
              ET.parse(file)
          print(f"Validated {len(files)} XML resource files")
          PYXML
