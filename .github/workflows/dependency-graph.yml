name: Verify resolved dependency security

on:
  push:
    branches: [main]
    paths:
      - '**/*.gradle.kts'
      - '**/gradle.properties'
      - '**/libs.versions.toml'
      - '**/gradle-wrapper.properties'
      - 'tools/validation/security-dependencies.init.gradle'
      - '.github/workflows/dependency-graph.yml'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
    paths:
      - '**/*.gradle.kts'
      - '**/gradle.properties'
      - '**/libs.versions.toml'
      - '**/gradle-wrapper.properties'
      - 'tools/validation/security-dependencies.init.gradle'
      - '.github/workflows/dependency-graph.yml'
  workflow_dispatch:
  workflow_call:

concurrency:
  group: dependency-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-security:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6f12 # v4.2.2
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@94baf225fe0a508e581a564467443d0e2379123b # v4
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Verify launcher and included-build dependency graphs
        run: |
          ./gradlew -I tools/validation/security-dependencies.init.gradle verifyDokkaSecurityDependencies verifyBuildSecurityDependencies \
            --no-configuration-cache --no-daemon --max-workers=1 --console=plain \
            -Dorg.gradle.parallel=false -Pkotlin.compiler.execution.strategy=in-process \
            '-Dorg.gradle.jvmargs=-Xmx7g -Dfile.encoding=UTF-8'
          ./gradlew -p libs/amethyst -I "$PWD/tools/validation/security-dependencies.init.gradle" verifyBuildSecurityDependencies \
            --no-configuration-cache --no-daemon --max-workers=1 --console=plain \
            -Dorg.gradle.parallel=false -Pkotlin.compiler.execution.strategy=in-process \
            '-Dorg.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8'
