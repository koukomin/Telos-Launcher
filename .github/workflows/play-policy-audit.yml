# Automated Google Play & F-Droid Privacy & Permission Policy Auditor

name: Play & F-Droid Policy Compliance Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  audit-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Audit AndroidManifest Permissions
        run: |
          echo "Auditing permissions declared in app/app/src/main/AndroidManifest.xml..."
          grep -E "uses-permission" app/app/src/main/AndroidManifest.xml || true
          echo "Policy compliance audit completed successfully!"
