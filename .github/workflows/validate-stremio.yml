name: Validate Stremio Fork
on:
  pull_request:
    paths:
      - 'tools/validation/**'
      - 'services/widgets/**'
      - 'data/widgets/**'
      - 'app/ui/src/main/java/de/mm20/launcher2/ui/launcher/widgets/**'
      - 'app/ui/src/main/java/de/mm20/launcher2/ui/theme/**'
      - 'app/ui/src/main/java/de/mm20/launcher2/ui/layout/**'
      - 'app/ui/src/test/java/de/mm20/launcher2/ui/layout/**'
      - 'app/ui/src/main/java/de/mm20/launcher2/ui/component/preferences/**'
      - 'app/ui/src/androidTest/**'
      - 'app/ui/src/test/java/de/mm20/launcher2/ui/theme/**'
      - 'app/ui/src/main/java/de/mm20/launcher2/ui/component/LauncherCard.kt'
      - 'app/ui/src/main/java/de/mm20/launcher2/ui/component/SearchBar.kt'
      - 'app/ui/src/main/java/de/mm20/launcher2/ui/launcher/scaffold/**'
      - 'services/network/**'
      - 'app/ui/src/main/java/de/mm20/launcher2/ui/network/**'
      - 'settings.gradle.kts'
      - 'app/ui/src/main/java/de/mm20/launcher2/ui/media/**'
      - 'services/comms/src/**'
      - 'services/store/src/**'
      - 'data/store/**'
      - 'data/comms/**'
      - 'gradle/libs.versions.toml'
      - 'app/ui/src/main/java/de/mm20/launcher2/ui/files/**'
      - 'app/ui/src/main/java/de/mm20/launcher2/ui/trash/**'
      - 'app/ui/src/main/java/de/mm20/launcher2/ui/comms/**'
      - 'app/ui/src/main/java/de/mm20/launcher2/ui/store/**'
      - 'app/ui/src/main/java/de/mm20/launcher2/ui/settings/**'
      - 'app/ui/src/main/AndroidManifest.xml'
      - 'core/base/src/**'
      - 'core/preferences/src/**'
      - 'services/freeze/**'
      - 'services/music/**'
      - 'services/wallpapers/**'
      - 'services/icons/**'
      - 'data/applications/**'
      - 'services/badges/**'
      - 'app/ui/src/main/java/de/mm20/launcher2/ui/component/ShapedLauncherIcon.kt'
      - 'app/ui/src/main/java/de/mm20/launcher2/ui/floating/**'
      - 'app/ui/src/main/java/de/mm20/launcher2/ui/launcher/search/**'
      - 'core/i18n/src/main/res/**'
      - '.github/workflows/validate-stremio.yml'
  workflow_dispatch:
# Keep only the newest checks for this PR; published releases use their own workflow.
concurrency:
  group: stremio-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify virtual-app Recents metadata
        run: python tools/validation/virtual_app_manifest.py
      - name: Validate changed translations and Android placeholders
        env:
          TELOS_TRANSLATION_BASE: ${{ github.event.pull_request.base.sha || github.sha }}
        run: python tools/translations/validate.py
      - name: Verify default SMS role eligibility
        run: python tools/validation/sms_manifest.py
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Test Stremio protocol and watched state
        run: ./gradlew :services:comms:testDebugUnitTest --stacktrace --no-daemon --max-workers=1 -Dorg.gradle.parallel=false -Pkotlin.compiler.execution.strategy=in-process -Dorg.gradle.jvmargs=-Xmx3072m
      - name: Test home media session discovery and priority
        run: ./gradlew :services:music:testDebugUnitTest --stacktrace --no-daemon --max-workers=1 -Dorg.gradle.parallel=false -Pkotlin.compiler.execution.strategy=in-process -Dorg.gradle.jvmargs=-Xmx3072m
      - name: Test Tor routing and Web3 resolution
        run: ./gradlew :services:network:testDebugUnitTest --stacktrace --no-daemon --max-workers=1 -Dorg.gradle.parallel=false -Pkotlin.compiler.execution.strategy=in-process -Dorg.gradle.jvmargs=-Xmx3072m
      - name: Test frozen launcher component ordering
        run: ./gradlew :data:applications:testDebugUnitTest --stacktrace --no-daemon --max-workers=1 -Dorg.gradle.parallel=false -Pkotlin.compiler.execution.strategy=in-process -Dorg.gradle.jvmargs=-Xmx3072m
      - name: Test persisted frozen-app snapshots
        run: ./gradlew :core:preferences:testDebugUnitTest --stacktrace --no-daemon --max-workers=1 -Dorg.gradle.parallel=false -Pkotlin.compiler.execution.strategy=in-process -Dorg.gradle.jvmargs=-Xmx3072m
      - name: Test freeze transitions and partial failures
        run: ./gradlew :services:freeze:testDebugUnitTest --stacktrace --no-daemon --max-workers=1 -Dorg.gradle.parallel=false -Pkotlin.compiler.execution.strategy=in-process -Dorg.gradle.jvmargs=-Xmx3072m
      - name: Test GIF wallpaper decoder limits
        run: ./gradlew :services:wallpapers:testDebugUnitTest --stacktrace --no-daemon --max-workers=1 -Dorg.gradle.parallel=false -Pkotlin.compiler.execution.strategy=in-process -Dorg.gradle.jvmargs=-Xmx3072m
      - name: Test virtual app task identities
        run: ./gradlew :core:base:testDebugUnitTest --tests 'de.mm20.launcher2.webapp.EmbeddedBrowserPolicyTest' --tests 'de.mm20.launcher2.applock.VirtualAppTaskTest' --tests 'de.mm20.launcher2.search.TelosAppKeywordsTest' --tests 'de.mm20.launcher2.helper.BatchNamesTest' --tests 'de.mm20.launcher2.helper.StorageAnalysisTest' --tests 'de.mm20.launcher2.helper.FileTrashTest' --tests 'de.mm20.launcher2.helper.FileSearchIndexTest' --tests 'de.mm20.launcher2.helper.FileTreeOpsTest' --tests 'de.mm20.launcher2.helper.ResumableFileTransferTest' --tests 'de.mm20.launcher2.helper.PasswordFileEncryptionTest' --tests 'de.mm20.launcher2.helper.SplitZipArchiveTest' --tests 'de.mm20.launcher2.helper.ExclusiveFilePublicationTest' --stacktrace --no-daemon --max-workers=1 -Dorg.gradle.parallel=false -Pkotlin.compiler.execution.strategy=in-process -Dorg.gradle.jvmargs=-Xmx3072m
      - name: Test Downloader queue and transfer policies
        run: ./gradlew :services:downloads:testDebugUnitTest --stacktrace --no-daemon --max-workers=1 -Dorg.gradle.parallel=false -Pkotlin.compiler.execution.strategy=in-process -Dorg.gradle.jvmargs=-Xmx3072m
      - name: Test Store download and update policies
        run: ./gradlew :services:store:testDebugUnitTest --stacktrace --no-daemon --max-workers=1 -Dorg.gradle.parallel=false -Pkotlin.compiler.execution.strategy=in-process -Dorg.gradle.jvmargs=-Xmx3072m
      - name: Test UI settings, archives, contact recovery, wallpaper contrast and adaptive layouts
        run: ./gradlew :app:ui:testDefaultDebugUnitTest :app:ui:compileDefaultDebugAndroidTestKotlin --no-daemon --max-workers=1 -Dorg.gradle.parallel=false -Pkotlin.compiler.execution.strategy=in-process -Dorg.gradle.jvmargs=-Xmx3072m --stacktrace
      - name: Test streaming APK downloads with a constrained heap
        run: ./gradlew :data:store:testDebugUnitTest --stacktrace --no-daemon --max-workers=1 -Dorg.gradle.parallel=false -Pkotlin.compiler.execution.strategy=in-process -Dorg.gradle.jvmargs=-Xmx3072m
      - name: Build debug APK
        run: ./gradlew :app:app:assembleDefaultDebug --stacktrace --no-daemon --max-workers=1 -Dorg.gradle.parallel=false -Pkotlin.compiler.execution.strategy=in-process -Dorg.gradle.jvmargs=-Xmx3072m
      - uses: actions/upload-artifact@v4
        with:
          name: telos-stremio-debug
          path: app/app/build/outputs/apk/default/debug/*.apk
      - name: Focused UI lint (API, descriptions and RTL)
        run: ./gradlew :app:ui:lintDefaultDebug -I tools/validation/ui-lint.init.gradle --no-daemon --max-workers=1 -Dorg.gradle.parallel=false -Dorg.gradle.jvmargs=-Xmx1536m -Pandroid.experimental.lint.heapSize=3g --stacktrace
      - name: Upload UI check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-ui-check-reports
          path: |
            app/ui/build/reports/tests/
            app/ui/build/reports/lint-results-*
            app/ui/build/test-results/

  video-glass-surface:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Build wallpaper surface instrumentation
        run: ./gradlew :services:wallpapers:assembleDebugAndroidTest --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew :services:wallpapers:connectedDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-glass-surface-test-results
          path: services/wallpapers/build/reports/androidTests/
          if-no-files-found: warn
