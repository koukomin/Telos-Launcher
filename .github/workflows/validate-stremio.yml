name: Validate Stremio Fork
on:
  pull_request:
    paths:
      - 'app/ui/src/main/java/de/mm20/launcher2/ui/media/**'
      - 'services/comms/src/**'
      - 'app/ui/src/main/java/de/mm20/launcher2/ui/settings/**'
      - 'app/ui/src/main/AndroidManifest.xml'
      - 'core/base/src/**'
      - 'core/i18n/src/main/res/**'
      - '.github/workflows/validate-stremio.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Test Stremio protocol and watched state
        run: ./gradlew :services:comms:testDebugUnitTest --tests 'de.mm20.launcher2.comms.stremio.*' --stacktrace
      - name: Test virtual app task identities
        run: ./gradlew :core:base:testDebugUnitTest --tests 'de.mm20.launcher2.applock.VirtualAppTaskTest' --stacktrace
      - name: Build debug APK
        run: ./gradlew :app:app:assembleDefaultDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: telos-stremio-debug
          path: app/app/build/outputs/apk/default/debug/*.apk
