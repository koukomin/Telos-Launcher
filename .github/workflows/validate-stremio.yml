name: Validate Stremio Fork
on:
  pull_request:
    paths:
      - 'app/ui/src/main/java/de/mm20/launcher2/ui/media/**'
      - 'services/comms/src/**'
      - 'services/store/src/**'
      - 'data/store/**'
      - 'data/comms/src/**'
      - 'app/ui/src/main/java/de/mm20/launcher2/ui/files/**'
      - 'app/ui/src/main/java/de/mm20/launcher2/ui/trash/**'
      - 'app/ui/src/main/java/de/mm20/launcher2/ui/comms/**'
      - 'app/ui/src/main/java/de/mm20/launcher2/ui/store/**'
      - 'app/ui/src/main/java/de/mm20/launcher2/ui/settings/**'
      - 'app/ui/src/main/AndroidManifest.xml'
      - 'core/base/src/**'
      - 'core/i18n/src/main/res/**'
      - '.github/workflows/validate-stremio.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Test Stremio protocol and watched state
        run: ./gradlew :services:comms:testDebugUnitTest --tests 'de.mm20.launcher2.comms.stremio.*' --tests 'de.mm20.launcher2.comms.tv.*' --tests 'de.mm20.launcher2.comms.youtube.*' --tests 'de.mm20.launcher2.comms.files.FilesSharingServerTest' --stacktrace
      - name: Test virtual app task identities
        run: ./gradlew :core:base:testDebugUnitTest --tests 'de.mm20.launcher2.applock.VirtualAppTaskTest' --tests 'de.mm20.launcher2.helper.BatchNamesTest' --tests 'de.mm20.launcher2.helper.StorageAnalysisTest' --tests 'de.mm20.launcher2.helper.FileTrashTest' --tests 'de.mm20.launcher2.helper.FileSearchIndexTest' --tests 'de.mm20.launcher2.helper.FileTreeOpsTest' --tests 'de.mm20.launcher2.helper.ResumableFileTransferTest' --stacktrace
      - name: Test Store download and update policies
        run: ./gradlew :services:store:testDebugUnitTest --stacktrace
      - name: Test Files settings import validation
        run: ./gradlew :app:ui:testDefaultDebugUnitTest --tests 'de.mm20.launcher2.ui.files.FilesSettingsTransferTest' --stacktrace
      - name: Test streaming APK downloads with a constrained heap
        run: ./gradlew :data:store:testDebugUnitTest --stacktrace
      - name: Build debug APK
        run: ./gradlew :app:app:assembleDefaultDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: telos-stremio-debug
          path: app/app/build/outputs/apk/default/debug/*.apk
