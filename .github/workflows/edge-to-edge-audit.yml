# Automated Edge-to-Edge & Android 15/16 Insets Compliance Auditor

name: Edge-to-Edge Insets Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  audit-insets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Verify Edge-to-Edge Insets & WindowCompat Compilation
        run: |
          echo "Verifying WindowCompat.setDecorFitsSystemWindows and WindowInsets usage..."
          ./gradlew compileDefaultDebugSources
          echo "Edge-to-Edge insets compilation check passed!"
