name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Dependency Review
        uses: actions/dependency-review-action@3b139ce56708b204988be4d207ec2a537f84966d # v4
        with:
          fail-on-severity: high
