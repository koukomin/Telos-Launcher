name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0

      - name: Dependency Review
        uses: actions/dependency-review-action@3b139ce56708b204988be4d207ec2a537f84966d # v4
        with:
          fail-on-severity: high
