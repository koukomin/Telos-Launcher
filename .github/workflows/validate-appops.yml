name: Validate embedded AppOps
on:
  push:
    branches: ['codex/system-freezer-appops-firewall']
  pull_request:
    paths:
      - 'libs/appops-next/**'
      - 'services/network/**'
      - 'app/ui/src/androidTest/java/de/mm20/launcher2/ui/system/FreezeDeskGridTest.kt'
      - 'app/ui/src/main/java/de/mm20/launcher2/ui/system/**'
      - 'app/ui/src/main/java/de/mm20/launcher2/ui/network/**'
      - '.github/workflows/validate-appops.yml'
  workflow_dispatch:
# Keep only the newest checks for this PR; published releases use their own workflow.
concurrency:
  group: embedded-appops-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  embedded-appops:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
      - uses: actions/setup-go@v7
        with:
          go-version-file: libs/appops-next/daemon/go.mod
          cache-dependency-path: libs/appops-next/daemon/go.mod
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Native daemon protocol tests
        working-directory: libs/appops-next/daemon
        run: go test ./...
      - name: Compile embedded suite and test AppOps transactions, parsers, templates and history
        run: |
          BUILD_STATUS=0
          bash ./gradlew :libs:appops-next:testDebugUnitTest :services:network:testDebugUnitTest :app:ui:assembleDefaultDebugAndroidTest --no-daemon --max-workers=1 -Dorg.gradle.parallel=false -Pkotlin.compiler.execution.strategy=in-process -Dorg.gradle.jvmargs=-Xmx3072m --stacktrace > "$RUNNER_TEMP/system-compile.log" 2>&1 || BUILD_STATUS=$?
          cat "$RUNNER_TEMP/system-compile.log"
          if [ "$BUILD_STATUS" -ne 0 ]; then
            python3 - <<'PY'
          from pathlib import Path
          import os
          lines = Path(os.environ['RUNNER_TEMP'], 'system-compile.log').read_text().splitlines()
          errors = [line for line in lines if line.startswith('e:') or 'error:' in line]
          message = chr(10).join(errors or lines[-35:])[:6000]
          message = message.replace('%', '%25').replace(chr(13), '%0D').replace(chr(10), '%0A')
          print('::error title=System Apps compilation::' + message)
          PY
          fi
          exit "$BUILD_STATUS"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash ./gradlew :app:ui:connectedDefaultDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=de.mm20.launcher2.ui.system.FreezeDeskGridTest --no-daemon --max-workers=1 -Dorg.gradle.parallel=false -Pkotlin.compiler.execution.strategy=in-process -Dorg.gradle.jvmargs=-Xmx2048m
      - name: Verify both grid regressions ran
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          expected = {'selectingFrozenTileAndSwitchingToListPreservesActions', 'shortWindowAtDoubleFontScaleCanReachLastAppAndHeader'}
          executed = set()
          failed = False
          for report in Path('app/ui/build/outputs/androidTest-results').rglob('TEST-*.xml'):
              for case in ET.parse(report).getroot().iter('testcase'):
                  if case.get('classname') != 'de.mm20.launcher2.ui.system.FreezeDeskGridTest':
                      continue
                  executed.add(case.get('name'))
                  for tag in ('failure', 'error', 'skipped'):
                      problem = case.find(tag)
                      if problem is not None:
                          failed = True
                          message = (problem.text or problem.get('message') or tag)[:6000]
                          message = message.replace('%', '%25').replace(chr(13), '%0D').replace(chr(10), '%0A')
                          print('::error title=Freezer grid regression::' + message)
          assert expected <= executed, f'Missing tests: {expected - executed}'
          assert not failed, 'Freezer layout regression failed or was skipped'
          print('::notice title=Freezer grid regression::Both grid/list and double-font short-window tests passed.')
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: embedded-appops-test-results
          path: |
            libs/appops-next/build/reports/tests/
            services/network/build/reports/tests/
            app/ui/build/outputs/androidTest-results/
            app/ui/build/reports/androidTests/
