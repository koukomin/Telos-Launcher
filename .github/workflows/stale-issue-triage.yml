# Automated Issue Triage & Stale Issue Purger for Telos Launcher

name: Issue Triage & Stale Purger

on:
  schedule:
    - cron: '0 0 * * *' # Daily at midnight UTC
  issues:
    types: [opened, edited]
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Mark Stale Issues & PRs
        uses: actions/stale@v11
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: 'This issue has been automatically marked as stale because it has not had recent activity. It will be closed in 14 days if no further activity occurs.'
          stale-pr-message: 'This PR has been automatically marked as stale because it has not had recent activity.'
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: 'stale'
          stale-pr-label: 'stale'
