# Automated Release Notes & Changelog Generator for Telos Launcher
# Generates formatted release notes on every release tag push (v*)

name: Auto Release Changelog Generator

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate Formatted Release Notes
        id: changelog
        run: |
          PREV_TAG=$(git tag -l 'v*' | sort -V | tail -n 2 | head -n 1)
          CURR_TAG=${GITHUB_REF_NAME:-v1.43.64}
          
          mkdir -p .github
          
          echo "# Telos Launcher $CURR_TAG Release Notes" > .github/release-notes-auto.md
          echo "" >> .github/release-notes-auto.md
          echo "##  What's New in $CURR_TAG" >> .github/release-notes-auto.md
          echo "" >> .github/release-notes-auto.md
          
          if [ -n "$PREV_TAG" ]; then
            echo "### Features & Improvements" >> .github/release-notes-auto.md
            git log ${PREV_TAG}..HEAD --oneline --grep="feat" --format="- %s" >> .github/release-notes-auto.md || true
            echo "" >> .github/release-notes-auto.md
            
            echo "### Fixes & Stability" >> .github/release-notes-auto.md
            git log ${PREV_TAG}..HEAD --oneline --grep="fix" --format="- %s" >> .github/release-notes-auto.md || true
            echo "" >> .github/release-notes-auto.md
            
            echo "### Performance & Security" >> .github/release-notes-auto.md
            git log ${PREV_TAG}..HEAD --oneline --grep="perf\|sec\|style" --format="- %s" >> .github/release-notes-auto.md || true
          fi
          
          cat .github/release-notes-auto.md

      - name: Commit Release Notes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/release-notes-auto.md
          git commit -m "docs(release): Automated release notes generated for $GITHUB_REF_NAME" || echo "No changes"
          git push origin main || echo "No push"
