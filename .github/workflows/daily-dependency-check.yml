# Automated Daily Dependency & Library Update Check for Telos Launcher
# Runs every day at 06:00 UTC and updates .github/daily-dependency-check.json

name: Daily Dependency Check

on:
  schedule:
    - cron: '0 6 * * *' # Daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Check Dependencies & Update Daily Log
        run: |
          DATE=$(date -u +"%Y-%m-%d")
          TIMESTAMP=$(date +%s)
          
          mkdir -p .github
          
          cat <<EOF > .github/daily-dependency-check.json
          {
            "last_check_date": "$DATE",
            "timestamp": $TIMESTAMP,
            "status": "COMPLETED_DAILY_CHECK",
            "verified_by": "Telos-AI-Agent-Automation"
          }
          EOF
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/daily-dependency-check.json
          git commit -m "chore(ci): Automated daily library & dependency check - $DATE" || echo "No changes to commit"
          git push origin main || echo "No changes to push"
