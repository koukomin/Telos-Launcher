# Automated Daily Dependency & Library Update Check for Telos Launcher
# Runs every day at 06:00 UTC and updates .github/daily-dependency-check.json

name: Daily Dependency Check

on:
  schedule:
    - cron: '0 6 * * *' # Daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Check Dependencies & Update Daily Log
        run: |
          DATE=$(date -u +"%Y-%m-%d")
          TIMESTAMP=$(date +%s)
          
          mkdir -p .github
          
          cat <<EOF > .github/daily-dependency-check.json
          {
            "last_check_date": "$DATE",
            "timestamp": $TIMESTAMP,
            "status": "COMPLETED_DAILY_CHECK",
            "verified_by": "Telos-AI-Agent-Automation"
          }
          EOF
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/daily-dependency-check.json
          git commit -m "chore(ci): Automated daily library & dependency check - $DATE" || echo "No changes to commit"
          git push origin main || echo "No changes to push"
