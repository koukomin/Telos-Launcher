name: Action runtime compatibility

on:
  pull_request:
    paths:
      - '.github/**'
      - 'docs/package*.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          check-latest: true
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-go@v7
        with:
          go-version-file: libs/appops-next/daemon/go.mod
          cache: false
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - uses: actions/cache@v6
        with:
          path: runtime-fixture
          key: runtime-smoke-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify toolchains and build documentation
        run: |
          java --version
          node --version
          python --version
          go version
          ./gradlew --version
          npm ci --prefix docs
          npm run docs:build --prefix docs
          mkdir -p runtime-fixture
          printf 'Node 24 action runtime smoke test\n' > runtime-fixture/result.txt
      - uses: actions/upload-artifact@v7
        with:
          name: runtime-roundtrip
          path: runtime-fixture/result.txt
          if-no-files-found: error
      - uses: actions/download-artifact@v8
        with:
          pattern: runtime-*
          path: runtime-restored
          merge-multiple: true
      - name: Verify artifact round trip
        run: cmp runtime-fixture/result.txt runtime-restored/result.txt
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist
          name: runtime-pages-smoke
