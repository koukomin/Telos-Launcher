name: Action runtime compatibility

on:
  pull_request:
    paths:
      - '.github/**'
      - 'docs/package*.json'
  workflow_dispatch:

permissions:
  contents: read
  # download-artifact needs actions:read to list/fetch artifacts from this run
  actions: read

jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          java-version: '21'
          distribution: temurin
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 'lts/*'
          check-latest: true
          package-manager-cache: false
      - uses: actions/setup-python@4066144eb887f0b5d033866503c5825aeb3f2fa1 # v5.3.0
        with:
          python-version: '3.11'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: libs/appops-next/daemon/go.mod
          cache: false
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: runtime-fixture
          key: runtime-smoke-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify toolchains and build documentation
        run: |
          java --version
          node --version
          python --version
          go version
          ./gradlew --version
          npm ci --prefix docs
          npm run docs:build --prefix docs
          mkdir -p runtime-fixture
          printf 'Node 24 action runtime smoke test\n' > runtime-fixture/result.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          retention-days: 7
          name: runtime-roundtrip
          path: runtime-fixture/result.txt
          if-no-files-found: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: runtime-roundtrip
          path: runtime-restored
      - name: Verify artifact round trip
        run: cmp runtime-fixture/result.txt runtime-restored/result.txt
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs/.vitepress/dist
          name: runtime-pages-smoke
