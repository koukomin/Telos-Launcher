name: Action runtime compatibility

on:
  pull_request:
    paths:
      - '.github/**'
      - 'docs/package*.json'
  workflow_dispatch:

permissions:
  contents: read
  # download-artifact needs actions:read to list/fetch artifacts from this run
  actions: read

jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6f12 # v4.2.2
        with:
          java-version: '21'
          distribution: temurin
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4
        with:
          node-version: 'lts/*'
          check-latest: true
          package-manager-cache: false
      - uses: actions/setup-python@4066144eb887f0b5d033866503c5825aeb3f2fa1 # v5.3.0
        with:
          python-version: '3.11'
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5
        with:
          go-version-file: libs/appops-next/daemon/go.mod
          cache: false
      - uses: gradle/actions/setup-gradle@94baf225fe0a508e581a564467443d0e2379123b # v4
        with:
          cache-provider: basic
      - uses: actions/cache@6849a6489940f00c2f30c0fb92c6274307ccb58a # v4
        with:
          path: runtime-fixture
          key: runtime-smoke-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify toolchains and build documentation
        run: |
          java --version
          node --version
          python --version
          go version
          ./gradlew --version
          npm ci --prefix docs
          npm run docs:build --prefix docs
          mkdir -p runtime-fixture
          printf 'Node 24 action runtime smoke test\n' > runtime-fixture/result.txt
      - uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4
        with:
          name: runtime-roundtrip
          path: runtime-fixture/result.txt
          if-no-files-found: error
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          name: runtime-roundtrip
          path: runtime-restored
      - name: Verify artifact round trip
        run: cmp runtime-fixture/result.txt runtime-restored/result.txt
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs/.vitepress/dist
          name: runtime-pages-smoke
