# CodeQL analysis of Android sources and GitHub Actions

name: CodeQL Security Scan

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
  schedule:
    - cron: '0 1 * * 0' # Weekly on Sunday at 01:00 UTC
  workflow_dispatch:
  workflow_call:

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: actions
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Set up JDK 21
        if: matrix.build-mode == 'manual'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        if: matrix.build-mode == 'manual'
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - uses: android-actions/setup-android@v4
        if: matrix.build-mode == 'manual'

      - name: Build Debug Sources
        if: matrix.build-mode == 'manual'
        # CodeQL must observe compilation, not restore compiled output from Gradle caches.
        # Actions language uses build-mode none (overlay PRs). Manual is only for Java/Kotlin.
        # https://docs.github.com/en/code-security/reference/code-scanning/troubleshoot-analysis-errors/no-source-code-seen-during-build
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6g -XX:+UseG1GC"
        run: |
          bash gradlew :app:app:compileDefaultDebugSources --no-daemon --no-build-cache --no-configuration-cache \
            --max-workers=1 -Dorg.gradle.parallel=false -Pkotlin.compiler.execution.strategy=in-process \
            '-Dorg.gradle.jvmargs=-Xmx7g -Dfile.encoding=UTF-8' \
            --rerun-tasks -Pkotlin.incremental=false

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
