# CodeQL analysis of Android sources and GitHub Actions

name: CodeQL Security Scan

on:
  push:
    branches: [main, codex/telos-dynamic-dns]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  schedule:
    - cron: '0 1 * * 0' # Weekly on Sunday at 01:00 UTC
  workflow_dispatch:
  workflow_call:

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preflight:
    uses: ./.github/workflows/validate-workflows.yml

  analyze:
    needs: preflight
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: actions
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Set up Android toolchain
        uses: ./.github/actions/android-toolchain
        if: matrix.build-mode == 'manual'
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build Debug Sources
        if: matrix.build-mode == 'manual'
        timeout-minutes: 85
        run: |
          bash .github/scripts/build-with-summary.sh :app:app:compileDefaultDebugSources --no-daemon --no-build-cache --no-configuration-cache \
            --max-workers=1 -Dorg.gradle.parallel=false -Pkotlin.compiler.execution.strategy=in-process \
            '-Dorg.gradle.jvmargs=-Xmx7g -Dfile.encoding=UTF-8' \
            --rerun-tasks -Pkotlin.incremental=false

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
