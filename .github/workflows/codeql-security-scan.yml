# CodeQL Static Security Analysis for Telos Launcher Kotlin & C++ Codebases

name: CodeQL Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 1 * * 0' # Weekly on Sunday at 01:00 UTC
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: ['java-kotlin']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: manual

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug Sources
        # CodeQL must observe compilation, not restore compiled output from Gradle caches.
        # https://docs.github.com/en/code-security/reference/code-scanning/troubleshoot-analysis-errors/no-source-code-seen-during-build
        run: >-
          ./gradlew compileDefaultDebugSources --no-daemon --no-build-cache
          --no-configuration-cache --rerun-tasks -Pkotlin.incremental=false

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
