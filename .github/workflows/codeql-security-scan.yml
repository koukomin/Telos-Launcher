# CodeQL Static Security Analysis for Telos Launcher Kotlin & C++ Codebases

name: CodeQL Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 1 * * 0' # Weekly on Sunday at 01:00 UTC
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: actions
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Set up JDK 21
        if: matrix.build-mode == 'manual'
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        if: matrix.build-mode == 'manual'
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build Debug Sources
        if: matrix.build-mode == 'manual'
        # CodeQL must observe compilation, not restore compiled output from Gradle caches.
        # Actions language uses build-mode none (overlay PRs). Manual is only for Java/Kotlin.
        # https://docs.github.com/en/code-security/reference/code-scanning/troubleshoot-analysis-errors/no-source-code-seen-during-build
        run: >-
          ./gradlew compileDefaultDebugSources --no-daemon --no-build-cache
          --no-configuration-cache --rerun-tasks -Pkotlin.incremental=false

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
