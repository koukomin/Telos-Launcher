name: Smart Actions Updater

on:
  schedule:
    - cron: '0 4 * * 0' # Run every Sunday at 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-actions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@4066144eb887f0b5d033866503c5825aeb3f2fa1 # v5
        with:
          python-version: '3.12'

      - name: Sync Actions to Latest Secure SHAs
        run: python3 tools/validation/sync_actions.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Pull Request with Updates
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6
        with:
          commit-message: "chore(ci): update github actions to latest secure SHAs"
          title: "chore(ci): update github actions to latest secure SHAs"
          body: |
            This PR automatically updates all GitHub Actions used in this repository to their latest secure commit SHAs, based on their latest stable semver tags.
            
            This prevents issues with mutable tags (like \`@v4\`) and keeps the CI environment fully up-to-date and secure.
            
            *Auto-generated by Telos Smart Action Updater.*
          branch: "ci/update-actions"
          labels: "dependencies, github-actions"
          delete-branch: true
