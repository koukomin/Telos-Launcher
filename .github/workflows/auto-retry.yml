name: Auto-Retry Failed Workflows

on:
  workflow_run:
    workflows: ["Release Telos Android", "Deploy static content to Pages", "CodeQL Security Scan"]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  retry-runner-failure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 1 &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      github.event.workflow_run.head_repository.full_name == github.repository
    steps:
      - name: Retry one confirmed runner startup failure
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/commits/$DEFAULT_BRANCH" --jq .sha)
          if [[ "$HEAD_SHA" != "$current" ]]; then exit 0; fi

          jobs=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/attempts/1/jobs?per_page=100")
          if jq -e '
            [.[].jobs[] | select(.conclusion == "failure")] as $failed |
            ($failed | length) > 0 and
            all($failed[]; any(.steps[]?; .number == 1 and .name == "Set up job" and .conclusion == "failure"))
          ' <<< "$jobs" >/dev/null; then
            gh run rerun "$RUN_ID" --failed --repo "$GITHUB_REPOSITORY"
            echo "Retried failed jobs after runner initialization failed." >> "$GITHUB_STEP_SUMMARY"
          fi
