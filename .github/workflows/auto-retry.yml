name: Auto-Retry Failed Workflows

on:
  workflow_run:
    workflows: ["Release Telos Android", "Deploy Telos Documentation", "CodeQL Security Scan"]
    types:
      - completed

permissions:
  actions: write

jobs:
  retry-failed-workflow:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'timed_out' && github.event.workflow_run.run_attempt == 1 && github.event.workflow_run.head_branch == github.event.repository.default_branch && github.event.workflow_run.head_repository.full_name == github.repository }}
    steps:
      - name: Auto-retry failed jobs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          echo "Workflow Run ID $RUN_ID failed due to timeout. Automatically retrying failed jobs..."
          gh run rerun "$RUN_ID" --failed --repo "$GITHUB_REPOSITORY"
