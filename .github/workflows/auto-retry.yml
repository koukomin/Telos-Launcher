name: Auto-Retry Failed Workflows

on:
  workflow_run:
    workflows: ["*"]
    types:
      - completed

permissions:
  actions: write

jobs:
  retry-failed-workflow:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 3 }}
    steps:
      - name: Auto-retry failed jobs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID=${{ github.event.workflow_run.id }}
          ATTEMPT=${{ github.event.workflow_run.run_attempt }}
          echo "Workflow Run ID $RUN_ID failed on attempt $ATTEMPT. Automatically retrying failed jobs..."
          gh run rerun $RUN_ID --failed
