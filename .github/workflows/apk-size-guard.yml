# Automated APK Size & Binary Bloat Guard for Telos Launcher
# Measures release APK size per commit and alerts if size increases unexpectedly (>1MB)

name: APK Size Guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  measure-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Release APK (arm64-v8a)
        run: ./gradlew :app:app:assembleDefaultRelease -Ptelos.abi=arm64-v8a

      - name: Measure APK & Native Library Size
        run: |
          APK_PATH=$(ls app/app/build/outputs/apk/default/release/*.apk | head -n 1)
          APK_SIZE_BYTES=$(stat -c%s "$APK_PATH")
          APK_SIZE_MB=$(echo "scale=2; $APK_SIZE_BYTES / 1048576" | bc)
          
          echo "Release APK Size: ${APK_SIZE_MB} MB (${APK_SIZE_BYTES} bytes)"
          
          mkdir -p .github
          cat <<EOF > .github/apk-size-report.json
          {
            "apk_size_mb": $APK_SIZE_MB,
            "apk_size_bytes": $APK_SIZE_BYTES,
            "timestamp": $(date +%s),
            "commit": "${{ github.sha }}"
          }
          EOF
          
          if [ $(echo "$APK_SIZE_MB > 55.0" | bc) -eq 1 ]; then
            echo "::warning::APK size exceeded threshold (Current: ${APK_SIZE_MB} MB)"
          fi
