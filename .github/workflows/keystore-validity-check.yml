# Automated Release Keystore Expiration & Certificate Validity Check

name: Keystore Validity Check

on:
  schedule:
    - cron: '0 0 1 * *' # Monthly on the 1st
  workflow_dispatch:

jobs:
  check-keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Check Keystore Certificate Expiration Date
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            mkdir -p /tmp/keystore
            echo "$KEYSTORE" | base64 -di > /tmp/keystore/keystore.jks
            keytool -list -v -keystore /tmp/keystore/keystore.jks -storepass "$KEYSTORE_PASSWORD" -alias "$SIGNING_KEY_ALIAS" || true
          fi
          echo "Keystore validity check completed!"
