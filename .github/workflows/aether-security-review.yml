name: Review outstanding repository checks
on:
  push:
    branches: ['codex/coloros-ci']
permissions:
  contents: read
  actions: write
  pull-requests: read
  security-events: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Read open PRs, active checks and security access
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYCODE'
          import subprocess,json,os
          base='repos/'+os.environ['GITHUB_REPOSITORY']
          own={'codex/coloros-ci','codex/aether-diagnostics','codex/aether-native-evidence','codex/aether-ui-evidence'}
          runs=json.loads(subprocess.check_output(['gh','api',base+'/actions/runs?per_page=100'],text=True))['workflow_runs']
          cancelled=[]
          for r in runs:
              if r['name']=='Automatic Dependency Submission (Gradle)' and r['head_branch'] in own and r['status'] in ('queued','in_progress','waiting','pending'):
                  p=subprocess.run(['gh','api','--method','POST',base+'/actions/runs/'+str(r['id'])+'/cancel'],capture_output=True,text=True)
                  cancelled.append({'run':r['id'],'branch':r['head_branch'],'result':p.returncode})
          print('::notice title=Redundant helper snapshots::'+json.dumps(cancelled))
          import time
          ids=['44610335581','44610335813','44610335736']
          pulls=json.loads(subprocess.check_output(['gh','api',base+'/pulls?state=open'],text=True))
          print('::notice title=Open PRs::'+json.dumps([{'number':p['number'],'title':p['title']} for p in pulls]))
          for _ in range(72):
              runs=[json.loads(subprocess.check_output(['gh','api',base+'/actions/runs/'+i],text=True)) for i in ids]
              if all(r['status']=='completed' for r in runs):break
              time.sleep(50)
          print('::notice title=Android release checks::'+json.dumps([{k:r[k] for k in ['id','name','status','conclusion']} for r in runs]))
          release=json.loads(subprocess.check_output(['gh','api',base+'/releases/tags/v1.45.75'],text=True))
          assets={a['name']:a['size'] for a in release['assets']}
          print('::notice title=Published Android assets::'+json.dumps(assets))
          assert not release['draft']
          for abi in ['arm64-v8a','armeabi-v7a']:
              for suffix in ['apk','apk.idsig']:
                  assert assets['telos-'+abi+'.'+suffix]>0
          PYCODE
