name: Scan the final resolved Island protocol fix
on:
  push:
    branches: ['codex/aether-security-review']
permissions:
  contents: read
  actions: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run full CodeQL on the final candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST repos/${{ github.repository }}/actions/workflows/codeql-security-scan.yml/dispatches -f ref=codex/aether-amethyst-embedded
          echo '::notice title=Final protocol scan::Full CodeQL requested for the final freeze intent fix and Aether client'
