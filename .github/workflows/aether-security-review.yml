name: Review outstanding repository checks
on:
  push:
    branches: ['codex/aether-security-review']
permissions:
  contents: read
  actions: write
  pull-requests: read
  security-events: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read open PRs, active checks and security access
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYCODE'
          import subprocess,json,os
          base='repos/'+os.environ['GITHUB_REPOSITORY']
          own={'codex/aether-security-review','codex/aether-diagnostics','codex/aether-native-evidence','codex/aether-ui-evidence'}
          runs=json.loads(subprocess.check_output(['gh','api',base+'/actions/runs?per_page=100'],text=True))['workflow_runs']
          cancelled=[]
          for r in runs:
              if r['name']=='Automatic Dependency Submission (Gradle)' and r['head_branch'] in own and r['status'] in ('queued','in_progress','waiting','pending'):
                  p=subprocess.run(['gh','api','--method','POST',base+'/actions/runs/'+str(r['id'])+'/cancel'],capture_output=True,text=True)
                  cancelled.append({'run':r['id'],'branch':r['head_branch'],'result':p.returncode})
          print('::notice title=Redundant helper snapshots::'+json.dumps(cancelled))
          sbom=json.loads(subprocess.check_output(['gh','api',base+'/dependency-graph/sbom'],text=True))['sbom']
          purls=[r['referenceLocator'] for p in sbom['packages'] for r in p.get('externalRefs',[]) if r.get('referenceType')=='purl']
          selected=[p for p in purls if any(k in p for k in ['/guava@','/freemarker@','/bcprov-jdk18on@','/bcpkix-jdk18on@','/commons-lang3@','/httpclient@','/jose4j@','/jdom2@','/opentelemetry-api@'])]
          print('::notice title=SBOM after duplicate retirement::'+json.dumps({'packages':len(purls),'selected':sorted(set(selected))}))
          scan=base+'/code-scanning'
          ref='refs/heads/codex/aether-amethyst-embedded'
          analyses=json.loads(subprocess.check_output(['gh','api',scan+'/analyses?ref='+ref+'&per_page=100'],text=True))
          matching=[a for a in analyses if a['commit_sha']=='d79b5fc776d23b2fa9321ef248278dc52396b9df']
          assert {'/language:java-kotlin','/language:actions'} <= {a.get('category') for a in matching}
          for a in matching:
              out={k:a.get(k) for k in ['id','commit_sha','results_count','category','error','warning']}
              print('::notice title=Final Java source analysis::'+json.dumps(out));assert not a.get('error')
          alerts=json.loads(subprocess.check_output(['gh','api',scan+'/alerts?state=open&ref='+ref+'&per_page=100'],text=True))
          print('::notice title=Final source open findings::'+json.dumps([{'number':a['number'],'rule':a['rule']} for a in alerts]));assert not alerts
          data=json.loads(subprocess.check_output(['gh','api',base+'/actions/runs/44474665043/jobs?per_page=100'],text=True))
          print('::notice title=Patched native rebuild progress::'+json.dumps([{'id':j['id'],'name':j['name'],'status':j['status'],'conclusion':j['conclusion'],'active':[t['name'] for t in j['steps'] if t['status']=='in_progress']} for j in data['jobs']]))
          PYCODE
      - uses: actions/checkout@v7
        with:
          ref: d79b5fc776d23b2fa9321ef248278dc52396b9df
      - name: Trace selected crypto dependencies without compiling native binaries
        working-directory: libs/amethyst/tools/arti-build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sed '$d' build-arti.sh > .ci-build-functions.sh
          source .ci-build-functions.sh
          rm .ci-build-functions.sh
          clone_or_update_arti
          setup_wrapper
          cargo tree --locked --manifest-path "$ARTI_SOURCE_DIR/arti-android-wrapper/Cargo.toml" --target all -i crypto-bigint > "$RUNNER_TEMP/crypto-tree.txt" 2>&1
          cargo tree --locked --manifest-path "$ARTI_SOURCE_DIR/arti-android-wrapper/Cargo.toml" --target all -e features -i ssh-key-fork-arti > "$RUNNER_TEMP/ssh-features.txt" 2>&1
          python3 - <<'PYCODE'
          import os,json
          from pathlib import Path
          for name in ['crypto-tree.txt','ssh-features.txt']:
              text=(Path(os.environ['RUNNER_TEMP'])/name).read_text()
              selected=[line for line in text.splitlines() if not any(t in line for t in ['Downloaded ','Downloading ','info:','warn:','Updating crates.io'])]
              if name=='ssh-features.txt':selected=sorted(set(line[line.index('ssh-key-fork-arti feature'):].strip() for line in selected if 'ssh-key-fork-arti feature' in line))
              print('::notice title=Selected native crypto features::'+json.dumps({'file':name,'lines':selected[:25]}))
          PYCODE
          python3 - <<'PYCODE'
          from pathlib import Path
          import json
          root=Path('/tmp/amethyst-arti-build/.arti-source/crates')
          for name in ['tor-key-forge','tor-keymgr']:
              lines=(root/name/'Cargo.toml').read_text().splitlines()
              selected=[]
              for i,l in enumerate(lines):
                  if 'ssh-key' in l:selected.extend(lines[max(0,i-1):min(len(lines),i+7)])
              print('::notice title=Upstream key-format dependencies::'+json.dumps({'crate':name,'lines':selected}))
          PYCODE
