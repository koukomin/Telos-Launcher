name: Review outstanding repository checks
on:
  push:
    branches: ['codex/aether-security-review']
permissions:
  contents: read
  actions: write
  pull-requests: read
  security-events: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read open PRs, active checks and security access
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYCODE'
          import subprocess,json,os
          base='repos/'+os.environ['GITHUB_REPOSITORY']
          import urllib.request
          sbom=json.loads(subprocess.check_output(['gh','api',base+'/dependency-graph/sbom'],text=True))['sbom']
          packages=sorted(set(r['referenceLocator'] for p in sbom['packages'] for r in p.get('externalRefs',[]) if r.get('referenceType')=='purl' and r['referenceLocator'].startswith(('pkg:maven/','pkg:cargo/','pkg:npm/','pkg:pypi/','pkg:nuget/','pkg:golang/'))))
          findings=[]
          for offset in range(0,len(packages),500):
              urls=packages[offset:offset+500]
              req=urllib.request.Request('https://api.osv.dev/v1/querybatch',data=json.dumps({'queries':[{'package':{'purl':p}} for p in urls]}).encode(),headers={'Content-Type':'application/json'})
              result=json.load(urllib.request.urlopen(req,timeout=120))
              for p,r in zip(urls,result['results']):
                  if r.get('vulns'):findings.append({'package':p,'ids':[v['id'] for v in r['vulns']]})
          print('::notice title=Complete SBOM advisory audit::'+json.dumps({'checked':len(packages),'findings':findings}))
          data=json.loads(subprocess.check_output(['gh','api',base+'/actions/runs/44471767507'],text=True))
          print('::notice title=Runtime retry status::'+json.dumps({k:data[k] for k in ['status','conclusion','run_attempt']}))
          PYCODE
