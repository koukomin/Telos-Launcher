name: Review outstanding repository checks
on:
  push:
    branches: ['codex/coloros-ci']
permissions:
  contents: read
  actions: write
  pull-requests: read
  security-events: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Read open PRs, active checks and security access
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYCODE'
          import subprocess,json,os
          base='repos/'+os.environ['GITHUB_REPOSITORY']
          own={'codex/coloros-ci','codex/aether-diagnostics','codex/aether-native-evidence','codex/aether-ui-evidence'}
          runs=json.loads(subprocess.check_output(['gh','api',base+'/actions/runs?per_page=100'],text=True))['workflow_runs']
          cancelled=[]
          for r in runs:
              if r['name']=='Automatic Dependency Submission (Gradle)' and r['head_branch'] in own and r['status'] in ('queued','in_progress','waiting','pending'):
                  p=subprocess.run(['gh','api','--method','POST',base+'/actions/runs/'+str(r['id'])+'/cancel'],capture_output=True,text=True)
                  cancelled.append({'run':r['id'],'branch':r['head_branch'],'result':p.returncode})
          print('::notice title=Redundant helper snapshots::'+json.dumps(cancelled))
          import re
          job='135909339800'
          response=subprocess.run(['gh','api','--allow-escape-sequences',base+'/actions/jobs/'+job+'/logs'],capture_output=True,text=True,check=True)
          lines=re.sub(r'\x1b\[[0-9;]*[A-Za-z]','',response.stdout).splitlines()
          key=[l for l in lines if re.search(r'error|failed|could not|what went wrong|exit value|disappear|no space|timeout',l,re.I)]
          for offset in range(0,min(len(key),30),8):
              print('::notice title=ARM64 failure::'+json.dumps(key[-30:][offset:offset+8])[:3500])
          info=json.loads(subprocess.check_output(['gh','api',base+'/actions/runs/44618689623', '--jq','{status,conclusion,run_attempt}'],text=True))
          print('::notice title=Current attempt::'+json.dumps(info))
          PYCODE
