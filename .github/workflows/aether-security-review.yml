name: Review outstanding repository checks
on:
  push:
    branches: ['codex/aether-security-review']
permissions:
  contents: read
  actions: write
  pull-requests: read
  security-events: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read open PRs, active checks and security access
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYCODE'
          import subprocess,json,os
          base='repos/'+os.environ['GITHUB_REPOSITORY']
          q='query { repository(owner:"koukomin",name:"Telos-Launcher") { dependencyGraphManifests(first:100) { nodes { filename blobPath dependencies(first:100) { nodes { packageName packageManager requirements } } } } } }'
          result=subprocess.run(['gh','api','graphql','-f','query='+q],capture_output=True,text=True)
          if result.returncode:print('::notice title=GraphQL access::'+result.stderr[:2000].replace('\n',' '))
          else:
              data=json.loads(result.stdout)
              wanted=['guava','opentelemetry-api','commons-lang3','httpclient','jose4j','bcprov-jdk18on','bcpkix-jdk18on','jdom2','freemarker']
              for m in data['data']['repository']['dependencyGraphManifests']['nodes']:
                  deps=[d for d in m['dependencies']['nodes'] if any(p in d['packageName'] for p in wanted)]
                  if deps:print('::notice title=Manifest graph::'+json.dumps({'file':m['filename'],'path':m['blobPath'],'deps':deps}))
          for job in ['135389526578']:
              response=subprocess.run(['gh','api','--allow-escape-sequences',base+'/actions/jobs/'+job+'/logs'],capture_output=True,text=True)
              lines=[line for line in response.stdout.splitlines() if '::notice title=Disposable emulator retry::' in line and 'print(' not in line]
              print('::notice title=Emulator retry request::'+json.dumps({'returncode':response.returncode,'stderr':response.stderr[:500],'lines':lines}))
          PYCODE
