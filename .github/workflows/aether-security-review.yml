name: Inspect Aether restore failure
on:
  push:
    branches: ['codex/aether-security-review']
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read the completed UI job's runtime evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import subprocess,json,io,zipfile,os
          base='repos/'+os.environ['GITHUB_REPOSITORY']
          artifacts=json.loads(subprocess.check_output(['gh','api',base+'/actions/runs/44463126501/artifacts'],text=True))['artifacts']
          selected=next(a for a in artifacts if a['name']=='aether-client-device-results')
          data=subprocess.check_output(['gh','api',base+'/actions/artifacts/'+str(selected['id'])+'/zip'])
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              for name in archive.namelist():
                  if not name.endswith('aether-client-logcat.txt'):continue
                  lines=archive.read(name).decode(errors='replace').splitlines()
                  markers=[i for i,l in enumerate(lines) if 'Force stopping com.dimitris.telos' in l]
                  start=markers[-1] if markers else max(0,len(lines)-2000)
                  selected=[l for l in lines[max(0,start-15):] if any(x in l for x in ['ActivityTaskManager','ActivityManager','AndroidRuntime','AetherRuntime','am_crash','am_anr','FATAL','Fatal signal','Abort message','Background activity','BAL_'])]
                  out='\n'.join(selected[-160:])
                  for offset in range(0,len(out),3300):
                      print('::notice title=Restore runtime evidence::'+out[offset:offset+3300].replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          PY
