name: Validate final Aether security candidate
on:
  push:
    branches: ['codex/aether-security-review']
permissions:
  contents: read
  security-events: read
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Start CodeQL on the complete feature revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST repos/${{ github.repository }}/actions/workflows/codeql-security-scan.yml/dispatches -f ref=codex/aether-amethyst-embedded
          echo '::notice title=Security candidate::CodeQL dispatched for codex/aether-amethyst-embedded'
      - name: Check current Dependabot access
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os, subprocess, json
          r=subprocess.run(['gh','api','repos/'+os.environ['GITHUB_REPOSITORY']+'/dependabot/alerts?state=open&per_page=100'],capture_output=True,text=True)
          if r.returncode:
              print('::warning title=Dependabot API access::'+r.stderr.strip().replace('\n',' ')[:1500])
          else:
              data=json.loads(r.stdout)
              for a in data:
                  out={k:a.get(k) for k in ['number','dependency','security_advisory','security_vulnerability']}
                  print('::notice title=Open Dependabot alert::'+json.dumps(out)[:3800])
              print('::notice title=Dependabot alert count::'+str(len(data)))
          PY
