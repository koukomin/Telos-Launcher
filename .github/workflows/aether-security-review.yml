name: Review outstanding repository checks
on:
  push:
    branches: ['codex/aether-security-review']
permissions:
  contents: read
  actions: write
  pull-requests: read
  security-events: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read open PRs, active checks and security access
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYCODE'
          import subprocess,json,os
          base='repos/'+os.environ['GITHUB_REPOSITORY']
          for job in ['135389378081','135389526578']:
              logs=subprocess.check_output(['gh','api',base+'/actions/jobs/'+job+'/logs'],text=True)
              lines=[line for line in logs.splitlines() if ('::notice title=SBOM ' in line or '::notice title=Disposable emulator retry::' in line) and 'print(' not in line]
              print('::notice title=Audit and retry evidence::'+json.dumps({'job':job,'lines':lines}).replace('%','%25').replace('\n','%0A')[:30000])
          PYCODE
