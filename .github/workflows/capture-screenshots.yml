name: Capture Telos development screenshots
on:
  pull_request:
    paths:
      - '.github/workflows/capture-screenshots.yml'
      - '.github/scripts/capture_screenshots.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Prepare clean English dark-wallpaper screenshot build
        run: python3 docs/scripts/prepare_development_screenshots.py
      - name: Build emulator APK
        run: bash ./gradlew :app:app:assembleDefaultDebug -Ptelos.abi=x86_64 --no-daemon --max-workers=1 -Dorg.gradle.parallel=false -Pkotlin.compiler.execution.strategy=in-process -Dorg.gradle.jvmargs=-Xmx3072m --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back virtualscene -camera-front emulated
          script: python3 docs/scripts/capture_development_screenshots.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: telos-development-screenshots
          path: screenshots/
          if-no-files-found: warn
