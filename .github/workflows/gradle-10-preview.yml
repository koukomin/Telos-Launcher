name: Gradle 10 preview

on:
  push:
    branches: [codex/gradle-10-preview]
  workflow_dispatch:

concurrency:
  group: gradle-10-preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        build: [Telos, Amethyst]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        timeout-minutes: 15
        run: |
          for attempt in 1 2; do
            if timeout 6m sdkmanager --install 'platforms;android-37.0' 'platforms;android-37.2' 'ndk;27.0.12077973' </dev/null; then
              exit 0
            fi
          done
          echo '::error::Could not install Android 37.0, 37.2, and NDK 27 for Gradle 10'
          exit 1
      - name: Verify and compile the selected build
        env:
          BUILD: ${{ matrix.build }}
        run: |
          if [[ "$BUILD" == "Amethyst" ]]; then
            bash gradlew --version
            bash gradlew -p libs/amethyst :amethyst:assembleFdroidDebug --warning-mode all \
              --no-configuration-cache --no-daemon --max-workers=1 -Dorg.gradle.parallel=false \
              -Pkotlin.compiler.execution.strategy=in-process '-Dorg.gradle.jvmargs=-Xmx7g -Dfile.encoding=UTF-8'
          else
            bash gradlew --version
            bash gradlew :app:app:compileDefaultDebugSources --warning-mode all \
              --no-configuration-cache --no-daemon --max-workers=1 -Dorg.gradle.parallel=false \
              -Pkotlin.compiler.execution.strategy=in-process '-Dorg.gradle.jvmargs=-Xmx7g -Dfile.encoding=UTF-8'
          fi
