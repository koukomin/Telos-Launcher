name: Build Ironewolf Fenix ARM64

on:
  push:
    branches: ['codex/ironewolf-upstream']
    paths:
      - 'ironewolf/**'
      - '.github/workflows/build-ironewolf.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ironewolf-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Provision disposable native build runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get update
          sudo apt-get install -y cmake clang-18 curl git gpg make nasm ninja-build patch perl tar unzip xz-utils yq zlib1g-dev gawk jq m4 zip
          python3 ironewolf/engine.py doctor
      - name: Verify source and branding
        run: python3 -m unittest discover -s ironewolf/tests -v
      - name: Fetch pinned sources and apply upstream patches
        run: python3 ironewolf/engine.py prepare
      - name: Build full Fenix browser and hardened engine
        run: python3 ironewolf/engine.py build --project browser --arch arm64
      - name: Upload unsigned browser and provenance
        uses: actions/upload-artifact@v7
        with:
          name: ironewolf-arm64-unsigned
          path: |
            ironewolf/.state/source/outputs/apk/unsigned/ironewolf-arm64-v8a-unsigned.apk
            ironewolf/.state/source/outputs/apk/unsigned/*.provenance.json
          if-no-files-found: error
      - name: Preserve diagnostic logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ironewolf-native-logs
          path: |
            ironewolf/.state/source/build/logs/**
            ironewolf/.state/source/logs/**
            ironewolf/.state/prepare-started.json
          if-no-files-found: ignore
