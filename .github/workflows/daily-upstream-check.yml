name: Daily Upstream Projects Sentinel

on:
  schedule:
    - cron: "0 5 * * *" # Daily at 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code-scanning:
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: ./.github/workflows/codeql-security-scan.yml

  dependency-security:
    uses: ./.github/workflows/dependency-graph.yml

  check-upstreams:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.x"

      - name: Run Upstream Sentinel Check
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/upstream/check-upstreams.py
