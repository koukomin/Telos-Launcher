name: Daily Upstream Projects Sentinel

on:
  schedule:
    - cron: "0 5 * * *" # Daily at 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code-scanning:
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: ./.github/workflows/codeql-security-scan.yml

  dependency-security:
    uses: ./.github/workflows/dependency-graph.yml

  check-upstreams:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up Python
        uses: actions/setup-python@4066144eb887f0b5d033866503c5825aeb3f2fa1 # v5.3.0
        with:
          python-version: "3.x"

      - name: Run Upstream Sentinel Check
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/upstream/check-upstreams.py
