# Automated Asset Optimization & Vector Path Guard for Telos Launcher

name: Asset Optimization Guard

on:
  push:
    branches: [main]
    paths:
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.xml'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  optimize-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify Vector Drawables & Image Assets
        run: |
          python3 - <<'PYXML'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          files = [file for root in ['core/base/src/main/res/drawable']
                   for file in Path(root).rglob('*.xml')]
          if not files:
              raise SystemExit("No XML resources found")
          for file in files:
              ET.parse(file)
          print(f"Validated {len(files)} XML resource files")
          PYXML
