name: Build and Auto-Release (Android APK & Linux Desktop)

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Android APK (:app:app)
        run: ./gradlew :app:app:assembleDefaultDebug

      - name: Build Linux Desktop UberJar (:desktop-linux)
        run: ./gradlew :desktop-linux:packageUberJarForCurrentOS

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release_assets
          find app -name "*.apk" -exec cp {} release_assets/telos-android-debug.apk \;
          find desktop-linux/build/compose/jars -name "*.jar" -exec cp {} release_assets/telos-linux-desktop.jar \;
          cat << 'EOF' > release_assets/start-telos-desktop.sh
          #!/bin/bash
          export XDG_SESSION_TYPE=wayland
          export _JAVA_AWT_WM_NONREPARENTING=1
          java -jar "$(dirname "$0")/telos-linux-desktop.jar"
          EOF
          chmod +x release_assets/start-telos-desktop.sh

      - name: Create Automatic GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Telos Release #${{ github.run_number }} (Android & Linux DE)"
          body: |
            Automated dual-platform build:
            - **Android APK:** `telos-android-debug.apk`
            - **Linux Desktop Environment (Compose Desktop):** `telos-linux-desktop.jar` & `start-telos-desktop.sh`
          files: |
            release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
