
# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]
    paths:
      - docs/**/*
      - plugins/sdk/**/*
      - core/shared/**/*

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Use Gradle
        uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew dokkaGenerateHtml
        working-directory: .
      - run: mv build/dokka/html docs/public/reference
        working-directory: .
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: docs
      - run: npm run docs:build
        working-directory: docs
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/.vitepress/dist'
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      # The previous release left this Pages deployment active after its workflow timed out.
      # Cancel only that known abandoned deployment; never touch the live site's successful build.
      - name: Recover abandoned Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STALE_PAGES_SHA=f1319d02aae3570d293ae3e320392bab2ef71a7d
          STATUS=$(gh api "repos/$GITHUB_REPOSITORY/pages/deployments/$STALE_PAGES_SHA" --jq '.status' 2>/dev/null || true)
          case "$STATUS" in
            deployment_in_progress|queued|pending|building|in_progress)
              gh api --method POST "repos/$GITHUB_REPOSITORY/pages/deployments/$STALE_PAGES_SHA/cancel"
              ;;
          esac
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
