
# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]
    paths:
      - docs/**/*
      - plugins/sdk/**/*
      - core/shared/**/*
      - .github/workflows/deploy-docs.yml

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Set up Android toolchain for Dokka
        uses: ./.github/actions/android-toolchain
      - name: Build Dokka reference
        timeout-minutes: 35
        run: bash .github/scripts/build-with-summary.sh dokkaGenerateHtml --no-configuration-cache --stacktrace
        working-directory: .
      - run: mv build/dokka/html docs/public/reference
        working-directory: .
      - name: Use latest Node.js LTS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 'lts/*'
          check-latest: true
          package-manager-cache: false
      - run: npm ci
        working-directory: docs
      - run: npm run docs:build
        working-directory: docs
      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: 'docs/.vitepress/dist'
      # The previous release left this Pages deployment active after its workflow timed out.
      # Cancel only that known abandoned deployment; never touch the live site's successful build.
      - name: Recover abandoned Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STALE_PAGES_SHA=f1319d02aae3570d293ae3e320392bab2ef71a7d
          STATUS=$(gh api "repos/$GITHUB_REPOSITORY/pages/deployments/$STALE_PAGES_SHA" --jq '.status' 2>/dev/null || true)
          case "$STATUS" in
            deployment_in_progress|queued|pending|building|in_progress)
              gh api --method POST "repos/$GITHUB_REPOSITORY/pages/deployments/$STALE_PAGES_SHA/cancel"
              ;;
          esac
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
