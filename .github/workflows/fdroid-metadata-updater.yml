# Release metadata is committed before tagging; a detached tag job must not write main.
name: Validate release changelog metadata

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-release-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify the committed release notes for the actual version code
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          version = dict(line.split('=', 1) for line in Path('version.properties').read_text().splitlines() if '=' in line and not line.startswith('#'))
          code = version['versionCode']
          assert code.isdigit(), 'Release versionCode must be numeric'
          if os.environ['GITHUB_REF'].startswith('refs/tags/'):
              assert os.environ['GITHUB_REF_NAME'] == 'v' + version['versionName'], 'Tag and committed version disagree'
          for locale in ['en-US', 'el-GR']:
              path = Path('fastlane/metadata/android') / locale / 'changelogs' / (code + '.txt')
              text = path.read_text().strip()
              assert text and len(text) <= 500, f'{path}: expected 1–500 characters'
              print(f'Verified {locale} release changelog: {version["versionName"]} ({code})')
          PY
