# Automated F-Droid Metadata & Build Recipe Updater for Telos Launcher

name: F-Droid Metadata Updater

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-fdroid-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Update F-Droid Recipe & Version Metadata
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-v1.43.68}"
          VERSION_NAME="${TAG_NAME#v}"
          
          mkdir -p metadata/en-US/changelogs
          mkdir -p metadata/el-GR/changelogs
          
          echo "Automated F-Droid changelog entry for $TAG_NAME" > "metadata/en-US/changelogs/${VERSION_NAME}.txt"
          echo "Αυτόματη ενημέρωση F-Droid για την έκδοση $TAG_NAME" > "metadata/el-GR/changelogs/${VERSION_NAME}.txt"
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add metadata/
          git commit -m "chore(fdroid): Update F-Droid metadata and changelogs for $TAG_NAME" || echo "No changes"
          git push origin main || echo "No push"
