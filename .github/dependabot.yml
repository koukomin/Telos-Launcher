version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: '0 6 * * *'
      timezone: Europe/Athens
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - '*'
    commit-message:
      prefix: 'chore(ci)'
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: cron
      cronjob: '0 6 * * *'
      timezone: Europe/Athens
    open-pull-requests-limit: 5
    groups:
      gradle:
        patterns:
          - '*'
    commit-message:
      prefix: 'chore(deps)'
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: cron
      cronjob: '0 6 * * *'
      timezone: Europe/Athens
    open-pull-requests-limit: 5
    groups:
      docs-npm:
        patterns:
          - '*'
    commit-message:
      prefix: 'chore(docs)'
